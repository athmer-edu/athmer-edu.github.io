<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة أثمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* الفكرة: رحلة البذرة إلى الثمرة. أخضر النخيل للهوية، ذهبي التمر للإنجاز، نحاسي للكيمياء، أزرق البحر للبيئة */
:root{
  --bg:#F2F6F3; --surface:#FFFFFF; --ink:#14302A; --muted:#5A6E67; --line:#DCE6E0;
  --brand:#1D6A4D; --brand-soft:#E3F1EA; --fruit:#D9952B; --fruit-soft:#FBF0DC;
  --chem:#B4532C; --chem-soft:#F8E8E0; --env:#16808C; --env-soft:#DFF1F2;
  --display:"Reem Kufi", "Readex Pro", Tahoma, sans-serif;
  --body:"Readex Pro", "Segoe UI", Tahoma, sans-serif;
  --radius:18px; --shadow:0 1px 2px rgba(20,48,42,.06), 0 8px 24px rgba(20,48,42,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1916; --surface:#14231F; --ink:#E5EFEA; --muted:#9BB2A9; --line:#25392F;
    --brand:#53BC8D; --brand-soft:#1A3329; --fruit:#F0B657; --fruit-soft:#33291A;
    --chem:#E58256; --chem-soft:#36221A; --env:#45BCC8; --env-soft:#14313A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1916; --surface:#14231F; --ink:#E5EFEA; --muted:#9BB2A9; --line:#25392F;
  --brand:#53BC8D; --brand-soft:#1A3329; --fruit:#F0B657; --fruit-soft:#33291A;
  --chem:#E58256; --chem-soft:#36221A; --env:#45BCC8; --env-soft:#14313A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--fruit);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.35;text-wrap:balance;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* الشريط العلوي */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:26px;font-weight:700;color:var(--brand)}
.logo svg{width:30px;height:30px}
.nav{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
.nav a,.btn-ghost{padding:8px 14px;border-radius:999px;font-size:15px;color:var(--muted);background:none;border:0}
.nav a:hover,.btn-ghost:hover{background:var(--brand-soft);color:var(--brand)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 20px;font-weight:500;background:var(--brand);color:#fff;transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--fruit);color:#2A1B05}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:600}
.preview-note{background:var(--fruit-soft);color:var(--ink);font-size:13.5px;text-align:center;padding:6px 16px}

/* الصفحة الرئيسية */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:48px 0 24px}
.hero h1{font-size:clamp(56px,9vw,104px);color:var(--brand);letter-spacing:0}
.hero .tag{font-family:var(--display);font-size:clamp(20px,2.6vw,28px);color:var(--ink);margin:4px 0 18px}
.hero .tag b{color:var(--fruit);font-weight:700}
.hero p{color:var(--muted);max-width:46ch;margin:0 0 24px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{display:grid;place-items:center}
.hero-art svg{width:100%;max-width:380px;height:auto}
.grow path{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.6s ease-out forwards}
.grow .b2{animation-delay:.35s}.grow .b3{animation-delay:.55s}.grow .b4{animation-delay:.75s}
.grow .leaf{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:12px 0 40px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.step .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.step h3{font-size:18px}
.step p{margin:2px 0 0;color:var(--muted);font-size:14.5px}

.section-title{display:flex;align-items:baseline;gap:12px;margin:8px 0 18px}
.section-title h2{font-size:28px}
.section-title span{color:var(--muted);font-size:15px}

.subjects{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:56px}
.subject-card{--c:var(--chem);--cs:var(--chem-soft);position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:14px;transition:transform .2s, box-shadow .2s, border-color .2s}
.subject-card.env{--c:var(--env);--cs:var(--env-soft)}
.subject-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--c)}
.subject-card .band{position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.subject-card .head{display:flex;align-items:center;gap:14px}
.subject-card .badge{width:60px;height:60px;border-radius:18px;background:var(--cs);color:var(--c);display:grid;place-items:center}
.subject-card .grade{font-size:14px;color:var(--c);font-weight:600}
.subject-card h3{font-size:30px}
.subject-card ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.subject-card li{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted)}
.subject-card li b{font-family:var(--display);color:var(--c);font-weight:700;min-width:64px}
.meter{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--fruit));transition:width .6s}
.go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-weight:500;color:var(--c)}

/* صفحة المادة */
.subject-hero{--c:var(--chem);--cs:var(--chem-soft);background:var(--cs);border-bottom:1px solid var(--line)}
.subject-hero.env{--c:var(--env);--cs:var(--env-soft)}
.subject-hero .wrap{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding-top:28px;padding-bottom:28px}
.crumbs{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a:hover{color:var(--brand)}
.subject-hero h1{font-size:clamp(34px,5vw,48px);color:var(--c)}
.subject-hero .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin-top:6px}
.subject-hero .stats b{color:var(--ink);font-family:var(--display);font-size:20px}
.tree-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 14px;text-align:center;font-size:13px;color:var(--muted)}
.tree-box svg{width:200px;height:auto;display:block}

.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:22px 0 6px}
.legend span{display:flex;align-items:center;gap:6px}

.units{display:grid;gap:18px;margin:12px 0 28px}
.unit{--c:var(--chem);--cs:var(--chem-soft);background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.unit.env{--c:var(--env);--cs:var(--env-soft)}
.unit-head{width:100%;display:flex;align-items:center;gap:16px;padding:18px 22px;background:none;border:0;text-align:start}
.unit-num{flex:none;width:54px;height:54px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:13px;line-height:1.2;text-align:center}
.unit-num b{display:block;font-size:22px}
.unit-head h3{font-size:22px}
.unit-head .sub{font-size:14px;color:var(--muted)}
.unit-head .chev{margin-inline-start:auto;transition:transform .25s;color:var(--muted)}
.unit.open .chev{transform:rotate(180deg)}
.unit-body{display:none;padding:0 22px 20px}
.unit.open .unit-body{display:grid;gap:8px}
.lesson-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);transition:background .15s,border-color .15s}
.lesson-row:hover{background:var(--cs);border-color:var(--c)}
.lesson-row .code{font-family:var(--display);font-weight:700;color:var(--c);min-width:38px;font-size:17px}
.lesson-row .t{flex:1;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.chip.grow{background:var(--brand-soft);color:var(--brand)}
.chip.fruit{background:var(--fruit-soft);color:var(--fruit);font-weight:600}
.saved-ic{color:var(--fruit)}
.review-row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--fruit-soft);border:1px dashed var(--fruit);font-weight:500}
.review-row .t{flex:1}
.review-row small{display:block;color:var(--muted);font-weight:400}

.big-reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:56px}
.big-review{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,box-shadow .2s}
.big-review:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.big-review .k{font-size:13px;color:var(--fruit);font-weight:600}
.big-review h3{font-size:20px}
.big-review p{margin:0;font-size:14px;color:var(--muted)}

/* صفحة الدرس */
.lesson-head{--c:var(--chem);--cs:var(--chem-soft);border-bottom:1px solid var(--line);background:var(--surface)}
.lesson-head.env{--c:var(--env);--cs:var(--env-soft)}
.lesson-head .wrap{padding-top:22px;padding-bottom:0}
.lesson-title{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
.lesson-title .code{font-family:var(--display);font-size:20px;color:#fff;background:var(--c);border-radius:14px;padding:6px 14px}
.lesson-title h1{font-size:clamp(26px,4vw,38px);flex:1;min-width:240px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:12px 16px;border-bottom:3px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--c);border-bottom-color:var(--c)}
.lesson-main{display:grid;grid-template-columns:1fr 300px;gap:24px;padding:28px 0 64px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;min-height:320px}
.side{display:grid;gap:16px;position:sticky;top:84px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h3{font-size:17px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.criteria{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14.5px}
.criteria li{display:flex;gap:8px;align-items:flex-start}
.criteria input{margin-top:6px;accent-color:var(--brand);width:16px;height:16px}
.pill-note{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:99px;background:var(--fruit-soft);color:var(--fruit);font-weight:600;margin-bottom:10px}
.empty{display:grid;place-items:center;text-align:center;gap:10px;padding:40px 10px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px}
.slide{aspect-ratio:16/9;border-radius:16px;background:linear-gradient(135deg,var(--cs),var(--surface));border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:20px}
.slide h3{font-size:clamp(22px,3vw,32px);color:var(--c)}
.slide-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:14px}

.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.flip{perspective:900px;height:190px;border:0;background:none;padding:0;text-align:center}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;padding:16px;font-size:15px}
.flip .f{background:var(--cs);border:1px solid var(--line);font-family:var(--display);font-size:20px;color:var(--c)}
.flip .b{background:var(--surface);border:2px solid var(--c);transform:rotateY(180deg);line-height:1.7}
.flip small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}

.sorter{display:grid;gap:14px}
.sort-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.sort-item .t{flex:1;font-weight:500;min-width:160px}
.sort-item button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px}
.sort-item.ok{border-color:var(--brand);background:var(--brand-soft)}
.sort-item.no{border-color:var(--chem);background:var(--chem-soft)}

.q{display:grid;gap:10px}
.q .stem{font-weight:600;font-size:17px}
.opt{display:flex;gap:12px;align-items:center;text-align:start;width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--c)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:600;font-size:14px}
.opt.right{border-color:var(--brand);background:var(--brand-soft)}
.opt.right .l{background:var(--brand);color:#fff}
.opt.wrong{border-color:var(--chem);background:var(--chem-soft)}
.feedback{border-radius:14px;padding:12px 16px;background:var(--fruit-soft);font-size:15px;display:none}
.feedback.show{display:block}

.done-box{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px;padding:16px 18px;border-radius:18px;background:var(--brand-soft)}
.done-box p{margin:0;font-weight:500}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:500;transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:50;box-shadow:var(--shadow);white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}

.saved-list{display:grid;gap:10px;margin:20px 0 60px}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:14px;text-align:center}
footer b{font-family:var(--display);color:var(--brand)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:28px}
  .hero-art{order:-1}.hero-art svg{max-width:240px}
  .steps,.subjects,.big-reviews{grid-template-columns:1fr}
  .lesson-main{grid-template-columns:1fr}
  .side{position:static}
  .subject-hero .wrap{grid-template-columns:1fr}
  .nav a.hide-sm{display:none}
}
@media (max-width:480px){
  .logo span{display:none}
  .user-chip .nm{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .grow path{stroke-dashoffset:0}.grow .leaf{transform:scale(1)}
}
</style>
</head>
<body>
<div class="preview-note" id="previewNote">نسخة معاينة للتصميم: تسجيل الدخول هنا تجريبي، ويعمل الدخول الحقيقي بحساب Google بعد رفع المنصة على athmer-edu.github.io</div>
<header class="topbar">
  <div class="wrap">
    <a class="logo" href="#home" aria-label="منصة أثمر، الصفحة الرئيسية">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 29V15" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M16 17c-6 0-9-4-9-9 5 0 9 3 9 9z" fill="currentColor"/><path d="M16 14c0-5 3-9 9-9 0 5-3 9-9 9z" fill="currentColor" opacity=".7"/><circle cx="22.5" cy="20.5" r="4.2" fill="var(--fruit)"/></svg>
      أثمِر
    </a>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main id="app"></main>
<footer><div class="wrap"><b>أثمِر</b> · كلُّ درسٍ بذرة، وكلُّ نجاحٍ ثمرة · منهج سلطنة عُمان، الفصل الدراسي الأول</div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== بيانات المنهج (من فهرس كتاب الطالب) ===== */
const SUBJECTS = {
  chem10: {
    key:"chem10", kind:"chem", name:"الكيمياء", grade:"الصف العاشر",
    units:[
      {n:1, title:"الفلزات وخصائصها", lessons:[["1-1","الترابط وخصائص الفلزات"],["1-2","العناصر الانتقالية"],["1-3","الفلزات القلوية"],["1-4","نشاط الفلزات"]]},
      {n:2, title:"استخلاص الفلزات واستخداماتها", lessons:[["2-1","استخلاص الفلزات"],["2-2","إنتاج الحديد والفولاذ"],["2-3","السبائك"],["2-4","تآكل الفلزات وحمايتها"]]},
      {n:3, title:"الكيمياء الكمية", lessons:[["3-1","الكتل النسبية"],["3-2","المول"],["3-3","حسابات تتضمن كتلًا متفاعلة"],["3-4","حسابات تتضمن حجوم الغازات"],["3-5","حسابات تتضمن محاليل متفاعلة"]]},
      {n:4, title:"مدخل إلى الكيمياء العضوية", lessons:[["4-1","الألكانات"],["4-2","الألكينات"],["4-3","البترول (النفط الخام) وأنواع أخرى من الوقود الأحفوري"]]}
    ],
    bigReviews:[
      {k:"مراجعة مجمّعة", t:"الوحدتان الأولى والثانية", d:"الفلزات من خصائصها إلى استخلاصها وحمايتها."},
      {k:"مراجعة مجمّعة", t:"الوحدتان الثالثة والرابعة", d:"الحسابات الكيميائية ومدخل الكيمياء العضوية."},
      {k:"قبل الاختبار النهائي", t:"المراجعة الشاملة للفصل", d:"كل الوحدات في اختبار محاكٍ بوقت محدد."}
    ]
  },
  env11: {
    key:"env11", kind:"env", name:"العلوم البيئية", grade:"الصف الحادي عشر",
    units:[
      {n:1, title:"مقدمة في الإدارة البيئية", lessons:[["1-1","الاستدامة"],["1-2","دورة الماء"],["1-3","النظم البيئية"]]},
      {n:2, title:"البحوث البيئية وجمع البيانات", lessons:[["2-1","المنهج العلمي"],["2-2","جمع البيانات البيئية"]]},

const lid = (sk,code)=>`${sk}-${code}`;
const statusOf = id => S.status[id] || "seed";
function subjectProgress(sk){
  const all = SUBJECTS[sk].units.flatMap(u=>u.lessons.map(l=>lid(sk,l[0])));
  const done = all.filter(id=>statusOf(id)==="fruit").length;
  return {done, total:all.length, pct: Math.round(done/all.length*100)};
}

/* ===== الشجرة: فرع لكل وحدة، ونقطة لكل درس (بذرة / ورقة / ثمرة) ===== */
function treeSVG(sk, w=200){
  const sub = SUBJECTS[sk];
  const pts = [[100,52,-1],[100,52,1],[100,92,-1],[100,92,1]];
  let g = `<path d="M100 196 C100 150 98 110 100 40" stroke="var(--brand)" stroke-width="7" stroke-linecap="round" fill="none"/>`;
  sub.units.forEach((u,i)=>{
    const [x,y,dir] = pts[i];
    const ex = x + dir*80, ey = y - 24;
    g += `<path d="M${x} ${y+30} Q ${x+dir*40} ${y+18} ${ex} ${ey}" stroke="var(--brand)" stroke-width="4" stroke-linecap="round" fill="none"/>`;
    u.lessons.forEach((l,j)=>{
      const t = (j+1)/(u.lessons.length+0.5), m = 1-t;
      const bx = m*m*x + 2*m*t*(x+dir*40) + t*t*ex;
      const by = m*m*(y+30) + 2*m*t*(y+18) + t*t*ey;
      const px = bx, py = by - 9 + (j%2)*16;
      const st = statusOf(lid(sk,l[0]));
      if(st==="fruit") g += `<circle cx="${px}" cy="${py+8}" r="8" fill="var(--fruit)"/><path d="M${px} ${py} q2 -5 6 -6" stroke="var(--brand)" stroke-width="2" fill="none"/>`;
      else if(st==="grow") g += `<ellipse cx="${px}" cy="${py}" rx="9" ry="5.5" transform="rotate(${dir*-30} ${px} ${py})" fill="var(--brand)" opacity=".85"/>`;
      else g += `<circle cx="${px}" cy="${py}" r="5" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 2"/>`;
    });
  });
  g += `<ellipse cx="100" cy="198" rx="54" ry="6" fill="var(--line)"/>`;
  return `<svg viewBox="0 0 200 206" width="${w}" role="img" aria-label="شجرة التقدم في ${sub.name}">${g}</svg>`;
}

  }
  if(tab==="exams"){
    if(!demo) return emptyState("الأسئلة قيد الزراعة","ستظهر هنا أسئلة الاختبارات السابقة لهذا الدرس مع التصحيح الفوري.");
    const opts=["وجود أيونات سالبة حرّة الحركة","وجود إلكترونات غير متمركزة حرّة الحركة","وجود جزيئات متعادلة بين الأيونات","قوة الروابط التساهمية بين الذرات"];
    return `<span class="pill-note">سؤال توضيحي بنفس شكل أسئلة الاختبارات</span>
      <div class="q" data-right="1">
        <div class="stem">١. أيٌّ مما يأتي يفسّر قدرة الفلزات على توصيل التيار الكهربائي؟</div>
        ${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">${"أبجد"[i]}</span>${o}</button>`).join("")}
        <div class="feedback" id="fb"></div>
      </div>`;
  }
}
function viewLesson(id){
  const f=findLesson(id); if(!f) return viewHome();
  const {sk,u,l}=f, s=SUBJECTS[sk];
  if(S.user && statusOf(id)==="seed"){ S.status[id]="grow"; save(); }
  const st=statusOf(id);
  return `<section class="lesson-head ${s.kind}"><div class="wrap">
      <div class="crumbs"><a href="#home">الرئيسية</a><span>/</span><a href="#${sk}">${s.name}</a><span>/</span><span>الوحدة ${UNIT_WORDS[u.n]}: ${u.title}</span></div>
      <div class="lesson-title"><span class="code">${l[0]}</span><h1>${l[1]}</h1>
        <button class="btn light" id="saveBtn" aria-pressed="${!!S.saved[id]}"><span class="saved-ic">${IC.save(!!S.saved[id])}</span>${S.saved[id]?"محفوظ":"احفظ للرجوع له"}</button></div>
      <div class="tabs" role="tablist">${TABS.map(t=>`<button class="tab ${t[0]===currentTab?"on":""}" role="tab" data-tab="${t[0]}" aria-selected="${t[0]===currentTab}">${t[2]}${t[1]}</button>`).join("")}</div>
    </div></section>
    <div class="wrap lesson-main" style="--c:var(--${s.kind});--cs:var(--${s.kind}-soft)">
      <div>
        <div class="panel" id="panel">${tabContent(id,currentTab)}</div>
        <div class="done-box">${st==="fruit"
          ? `<p>أثمر هذا الدرس في شجرتك. أحسنت!</p><a class="btn light" href="#${sk}">العودة للوحدات</a>`
          : `<p>أنهيت الدرس وفهمته؟ أضف ثمرته إلى شجرتك.</p><button class="btn gold" id="doneBtn">${IC.fruit} أنهيت الدرس</button>`}</div>
      </div>
      <aside class="side">
        <div class="card"><h3>${IC.stamp} معايير النجاح</h3>
          <ul class="criteria">
            <li><input type="checkbox" id="c1"><label for="c1">${id===DEMO?"أصف الترابط الفلزي.":"تُضاف معايير النجاح لهذا الدرس من ملف المعايير."}</label></li>
            ${id===DEMO?`<li><input type="checkbox" id="c2"><label for="c2">أفسّر توصيل الفلزات للكهرباء والحرارة.</label></li><li><input type="checkbox" id="c3"><label for="c3">أفسّر قابلية الفلزات للطرق والسحب.</label></li>`:""}
          </ul></div>
        <div class="card" style="text-align:center">${treeSVG(sk,170)}<div style="font-size:13px;color:var(--muted)">شجرتك في ${s.name}</div></div>
      </aside>
    </div>`;
}

/* ===== المراجعات ===== */
function viewReview(sk, label){
  const s=SUBJECTS[sk];
  return `<section class="subject-hero ${s.kind}"><div class="wrap"><div>
      <div class="crumbs"><a href="#home">الرئيسية</a><span>/</span><a href="#${sk}">${s.name}</a></div>
      <h1>${label}</h1></div></div></section>
    <div class="wrap" style="padding:28px 20px 64px"><div class="panel">${emptyState("المراجعة قيد الزراعة","ستضم: ملخص الوحدة في صفحة واحدة، وخريطة ذهنية، واختبارًا شاملًا يُصحّح فورًا ويبيّن نقاط الضعف حسب الدرس.")}</div></div>`;
}

/* ===== محفوظاتي ===== */
function viewSaved(){
  const ids = Object.keys(S.saved).filter(k=>S.saved[k]);
  const rows = ids.map(id=>{ const f=findLesson(id); if(!f) return ""; return `<a class="lesson-row" style="--c:var(--${SUBJECTS[f.sk].kind});--cs:var(--${SUBJECTS[f.sk].kind}-soft)" href="#${id}"><span class="code">${f.l[0]}</span><span class="t">${f.l[1]} <small style="color:var(--muted)">· ${SUBJECTS[f.sk].name}</small></span>${chip(statusOf(id))}</a>`; }).join("");
  return `<div class="wrap" style="padding-top:32px"><div class="section-title"><h2>محفوظاتي</h2><span>دروس حفظتها لترجع لها</span></div>
    <div class="saved-list">${rows || `<div class="panel">${emptyState("لا توجد دروس محفوظة بعد","اضغط «احفظ للرجوع له» داخل أي درس، وسيظهر هنا.")}</div>`}</div></div>`;
}

/* ===== الموجّه ===== */
function render(){
  const route = (location.hash||"#home").slice(1) || "home";
  renderNav(route);
  let html;
  if(route==="home") html=viewHome();
  else if(SUBJECTS[route]) html=viewSubject(route);
  else if(route==="saved") html=viewSaved();
  else if(/^(chem10|env11)-review-\d$/.test(route)){ const [sk,,n]=route.split("-"); html=viewReview(sk,`مراجعة شاملة للوحدة ${UNIT_WORDS[n]}`); }
  else if(/^(chem10|env11)-big-\d$/.test(route)){ const [sk,,n]=route.split("-"); const r=SUBJECTS[sk].bigReviews[n-1]; html=viewReview(sk, r.t); }
  else html=viewLesson(route);
  $("#app").innerHTML = html;
  bind(route);
}
function bind(route){
  document.querySelectorAll(".unit-head").forEach(b=>b.onclick=()=>{
    const art=b.closest(".unit"), n=art.dataset.unit; const sk=route;
    art.classList.toggle("open"); S.open[sk]=S.open[sk]||{}; S.open[sk][n]=art.classList.contains("open"); b.setAttribute("aria-expanded",S.open[sk][n]); save();
  });
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ currentTab=t.dataset.tab; render(); });
  bindPanel();
  const sb=$("#saveBtn"); if(sb) sb.onclick=()=>{ if(needLogin())return; S.saved[route]=!S.saved[route]; save(); toast(S.saved[route]?"حُفظ الدرس في محفوظاتي":"أُزيل من محفوظاتي"); render(); };
  const db=$("#doneBtn"); if(db) db.onclick=()=>{ if(needLogin())return; S.status[route]="fruit"; save(); toast("أثمر تعبك! ثمرة جديدة في شجرتك"); render(); };
}
function bindPanel(){
  document.querySelectorAll(".flip").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
  document.querySelectorAll(".sort-item").forEach(it=>it.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.v===it.dataset.ans; it.classList.remove("ok","no"); it.classList.add(ok?"ok":"no");
    if(ok && document.querySelectorAll(".sort-item.ok").length===document.querySelectorAll(".sort-item").length) toast("ممتاز! صنّفت كل الخصائص بشكل صحيح");
  }));
  const q=document.querySelector(".q");
  if(q) q.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    const right=+q.dataset.right, i=+o.dataset.i, fb=$("#fb");
    q.querySelectorAll(".opt").forEach(x=>x.classList.remove("right","wrong"));
    q.querySelectorAll(".opt")[right].classList.add("right");
    if(i!==right) o.classList.add("wrong");
    fb.innerHTML = i===right ? "<b>إجابة صحيحة.</b> الإلكترونات غير المتمركزة تتحرك بحرية داخل الفلز فتنقل الشحنة الكهربائية."
      : "<b>ليست هذه الإجابة.</b> في الفلز لا توجد أيونات سالبة حرة؛ الذي يتحرك هو الإلكترونات غير المتمركزة، ولهذا يوصل الفلز الكهرباء.";
    fb.classList.add("show");
  });
}
window.addEventListener("hashchange",()=>{ currentTab="explain"; render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
