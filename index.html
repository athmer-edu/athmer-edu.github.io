<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة أثمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
/* الفكرة: دفتر معلمة أنيق. خط عصري للعناوين، خط مريح للقراءة، وخط الرقعة لملاحظات المعلمة بخط اليد.
   فهرس المادة يشبه صفحة المحتويات في كتاب الطالب، ورسم نباتي بخط واحد يرمز إلى النمو. */
:root{
  --paper:#F7F8F6; --sheet:#FFFFFF; --ink:#1A2622; --soft:#5E6B66; --rule:#E2E6E3;
  --palm:#1F4A3D; --palm-tint:#E6EEEA; --date:#C2852A; --date-tint:#F6EBD9;
  --chem:#9C4F2E; --chem-tint:#F4E7E0; --sea:#1D6672; --sea-tint:#E0EEF0;
  --marker:rgba(246,206,92,.55);
  --display:"Alexandria", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --hand:"Aref Ruqaa", "IBM Plex Sans Arabic", serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111816; --sheet:#172120; --ink:#E7EDEA; --soft:#9AAAA4; --rule:#28342F;
    --palm:#7CC3A4; --palm-tint:#1C2E28; --date:#E3AE5C; --date-tint:#33291B;
    --chem:#E29470; --chem-tint:#33231C; --sea:#6CC0CC; --sea-tint:#16303A;
    --marker:rgba(227,174,92,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111816; --sheet:#172120; --ink:#E7EDEA; --soft:#9AAAA4; --rule:#28342F;
  --palm:#7CC3A4; --palm-tint:#1C2E28; --date:#E3AE5C; --date-tint:#33291B;
  --chem:#E29470; --chem-tint:#33231C; --sea:#6CC0CC; --sea-tint:#16303A;
  --marker:rgba(227,174,92,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--date);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.hand{font-family:var(--hand);font-weight:400}

/* شريط علوي */
.note-bar{font-size:13px;color:var(--soft);text-align:center;padding:7px 16px;border-bottom:1px solid var(--rule)}
.topbar{background:var(--paper);position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:28px;height:72px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;color:var(--palm)}
.brand svg{width:26px;height:26px}
.nav{display:flex;gap:26px;align-items:center;font-size:15px;color:var(--soft)}
.nav a{position:relative;padding:4px 0}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);font-weight:500}
.nav a.on::after{content:"";position:absolute;inset:auto 0 -4px 0;height:2px;background:var(--date);border-radius:2px}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:12px;padding:12px 22px;font-weight:500;font-size:16px;background:var(--palm);color:var(--paper);transition:background .2s}
.btn:hover{background:color-mix(in srgb,var(--palm) 86%,var(--ink))}
.btn.sm{padding:8px 16px;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--soft)}
.btn.date{background:var(--date);color:#241603}
.btn.date:hover{background:color-mix(in srgb,var(--date) 88%,#000)}
.g{width:18px;height:18px;background:#fff;border-radius:50%;padding:2px}
.me{display:flex;align-items:center;gap:10px;font-size:15px}
.me .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--palm-tint);color:var(--palm);font-weight:600}
.link{color:var(--palm);font-weight:500;border-bottom:1px solid currentColor;padding-bottom:1px}

/* الواجهة */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding:64px 0 56px}
.hero .hello{font-size:30px;color:var(--date);line-height:1.2}
.hero h1{font-size:clamp(76px,11vw,140px);font-weight:800;color:var(--palm);line-height:1.25;margin:14px 0 10px}
.hero .motto{font-family:var(--display);font-weight:500;font-size:clamp(20px,2.4vw,27px);margin:0 0 18px}
.hero p{color:var(--soft);max-width:44ch;margin:0 0 30px}
.hero-actions{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.sign{margin-top:34px;display:flex;align-items:center;gap:14px;color:var(--soft);font-size:15px}
.sign .hand{font-size:26px;color:var(--ink)}
.sign::before{content:"";width:36px;height:1px;background:var(--rule)}
.branch{width:100%;max-width:420px;justify-self:center}
.branch .ln{fill:none;stroke:var(--palm);stroke-linecap:round;stroke-linejoin:round}
.branch .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.8s cubic-bezier(.6,0,.2,1) forwards}
.branch .fr{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .6s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}

/* المواد كصفحة محتويات */
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-top:2px solid var(--ink);padding-top:18px;margin-top:8px}
.shelf-head h2{font-size:30px}
.shelf-head span{color:var(--soft);font-size:15px}
.subject{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:48px;padding:40px 0;border-bottom:1px solid var(--rule)}
.subject:last-child{border-bottom:0}
.subject .who{display:flex;flex-direction:column;gap:6px}
.subject .grade{font-size:15px;color:var(--c);font-weight:600}
.subject h3{font-size:clamp(36px,4.6vw,52px);font-weight:800;line-height:1.15}
.subject .art{color:var(--c);margin:6px 0 10px}
.progress{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--soft);max-width:340px}
.track{flex:1;height:6px;border-radius:6px;background:var(--rule);overflow:hidden}
.track i{display:block;height:100%;background:var(--date);border-radius:6px;transition:width .6s}
.subject .enter{margin-top:22px;align-self:flex-start}
.toc{list-style:none;margin:0;padding:0;align-self:center}
.toc li{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px dashed var(--rule)}
.toc li:last-child{border-bottom:0}
.toc .u{font-family:var(--display);font-weight:600;color:var(--c);font-size:15px;min-width:92px}
.toc .t{font-weight:500}
.toc .lead{flex:1;border-bottom:2px dotted var(--rule);transform:translateY(-6px)}
.toc .n{color:var(--soft);font-size:14.5px;white-space:nowrap}
.chem{--c:var(--chem);--ct:var(--chem-tint)}
.env{--c:var(--sea);--ct:var(--sea-tint)}

/* صفحة المادة */
.page-head{padding:44px 0 36px;border-bottom:1px solid var(--rule)}
.page-head .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:end}
.crumbs{font-size:14px;color:var(--soft);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.crumbs a:hover{color:var(--ink)}
.page-head h1{font-size:clamp(44px,6vw,72px);font-weight:800;color:var(--c);line-height:1.1}
.page-head .lede{color:var(--soft);margin:12px 0 18px;max-width:52ch}
.tree-card{text-align:center;color:var(--soft);font-size:14px}
.tree-card svg{width:210px;height:auto;display:block;margin:0 auto 4px}
.key{display:flex;gap:26px;flex-wrap:wrap;font-size:14px;color:var(--soft);padding:22px 0 6px}
.key span{display:flex;align-items:center;gap:8px}

.unit{border-bottom:1px solid var(--rule)}
.unit-head{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;width:100%;padding:26px 0;text-align:start}
.unit-no{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:var(--ct);-webkit-text-stroke:1.5px var(--c);min-width:56px;text-align:center}
.unit-head .lbl{font-size:14px;color:var(--c);font-weight:600}
.unit-head h2{font-size:clamp(22px,2.6vw,28px)}
.unit-head .cnt{font-size:14px;color:var(--soft)}
.unit-head .chev{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--rule);transition:transform .3s}
.unit.open .chev{transform:rotate(180deg)}
.unit-body{display:none;padding:0 0 30px;padding-inline-start:78px}
.unit.open .unit-body{display:block}
.lesson{display:flex;align-items:baseline;gap:14px;padding:13px 6px;border-radius:8px;transition:background .15s}
.lesson:hover{background:var(--ct)}
.lesson .code{font-family:var(--display);font-weight:600;color:var(--c);min-width:36px}
.lesson .t{font-weight:500}
.lesson .lead{flex:1;border-bottom:2px dotted var(--rule);transform:translateY(-6px);min-width:24px}
.state{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--soft);white-space:nowrap}
.state.grow{color:var(--palm)}
.state.fruit{color:var(--date);font-weight:600}
.state svg{flex:none}
.bm{color:var(--date);display:inline-flex}
.unit-review{display:flex;align-items:center;gap:14px;margin-top:14px;padding:16px 18px;border-radius:14px;background:var(--date-tint)}
.unit-review .t{flex:1}
.unit-review b{font-family:var(--display);font-weight:600;display:block}
.unit-review small{color:var(--soft);font-size:14px}
.unit-review .go{color:var(--date)}

.route{margin:56px 0 72px}
.route h2{font-size:28px;margin-bottom:6px}
.route > p{color:var(--soft);margin:0 0 30px}
.stops{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative}
.stops::before{content:"";position:absolute;top:11px;inset-inline:16px;height:2px;background:repeating-linear-gradient(to left,var(--rule) 0 8px,transparent 8px 14px)}
.stop{position:relative;padding-inline-end:24px}
.stop .dot{width:24px;height:24px;border-radius:50%;background:var(--paper);border:2px solid var(--date);display:block;margin-bottom:16px;position:relative}
.stop:last-child .dot{background:var(--date)}
.stop h3{font-size:19px;margin-bottom:4px}
.stop p{margin:0 0 10px;color:var(--soft);font-size:15px}

/* صفحة الدرس */
.lesson-top{border-bottom:1px solid var(--rule)}
.lesson-top .wrap{padding-top:34px}
.lesson-title{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:22px}
.lesson-title .num{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--ct);-webkit-text-stroke:1.5px var(--c)}
.lesson-title h1{font-size:clamp(28px,3.6vw,42px);flex:1;min-width:240px}
.tabs{display:flex;gap:30px;overflow-x:auto;scrollbar-width:none}
.tab{padding:14px 0;color:var(--soft);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--c)}
.tab.on svg{color:var(--c)}
.lesson-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;padding:36px 0 80px;align-items:start}
.stage{min-height:340px}
.aside{display:grid;gap:28px;position:sticky;top:96px}
.aside h3{font-size:17px;margin-bottom:12px}
.criteria{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:15.5px}
.criteria label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.criteria input{appearance:none;flex:none;width:20px;height:20px;margin-top:5px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--soft);display:grid;place-items:center;cursor:pointer}
.criteria input:checked{background:var(--palm);box-shadow:none}
.criteria input:checked::after{content:"";width:5px;height:10px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.teacher-note{position:relative;padding:18px 20px;background:var(--date-tint);border-radius:4px 18px 18px 18px;font-family:var(--hand);font-size:22px;line-height:1.7}
.teacher-note small{display:block;font-family:var(--body);font-size:13px;color:var(--soft);margin-top:6px}
.example{display:inline-block;font-size:13px;color:var(--soft);margin-bottom:16px;padding-bottom:2px;border-bottom:1px dashed var(--soft)}
.empty{display:grid;justify-items:start;gap:8px;padding:30px 0;max-width:46ch}
.empty h3{font-size:24px}
.empty p{color:var(--soft);margin:0}
.slide{aspect-ratio:16/9;border-radius:16px;background:var(--ct);display:grid;place-items:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.slide h3{font-size:clamp(26px,3.4vw,40px);color:var(--c);font-weight:800}
.slide p{color:var(--soft);margin:6px 0 0;font-size:15px}
.slide-bar{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:14px;color:var(--soft)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.flip{perspective:1000px;height:200px;text-align:center;width:100%}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;padding:20px}
.flip .f{background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule);font-family:var(--display);font-weight:600;font-size:20px}
.flip .f small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--soft);margin-top:8px}
.flip .b{background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--c);transform:rotateY(180deg);font-size:16px;line-height:1.75}
mark{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit;padding:0 2px}

.sort{display:grid;gap:4px}
.sort-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 4px;border-bottom:1px solid var(--rule)}
.sort-row .t{flex:1;min-width:170px;font-weight:500}
.sort-row button{padding:6px 16px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);font-size:15px}
.sort-row button:hover{box-shadow:inset 0 0 0 1px var(--soft)}
.sort-row.ok .t::after{content:"  صحيح";color:var(--palm);font-size:14px;font-weight:600}
.sort-row.no .t::after{content:"  حاول مرة أخرى";color:var(--chem);font-size:14px;font-weight:600}

.q .stem{font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:start;width:100%;padding:14px 16px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--rule);background:var(--sheet);transition:box-shadow .15s}
.opt:hover{box-shadow:inset 0 0 0 1px var(--soft)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1px var(--rule)}
.opt.right{box-shadow:inset 0 0 0 2px var(--palm)}
.opt.right .l{background:var(--palm);color:var(--paper);box-shadow:none}
.opt.wrong{box-shadow:inset 0 0 0 2px var(--chem)}
.explain{display:none;margin-top:16px;padding:14px 18px;border-inline-start:3px solid var(--date);background:var(--date-tint);border-radius:0 10px 10px 0;font-size:16px}
.explain.show{display:block}

.finish{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:36px;padding-top:24px;border-top:1px solid var(--rule)}
.finish p{margin:0;font-weight:500}

.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:13px 24px;border-radius:12px;font-weight:500;transition:transform .3s,opacity .3s;z-index:50;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}

.saved{padding:44px 0 80px}
.saved h1{font-size:44px;font-weight:800;margin-bottom:6px}
.saved > p{color:var(--soft);margin:0 0 26px}
footer{border-top:1px solid var(--rule);padding:28px 0 36px;color:var(--soft);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer .hand{font-size:20px;color:var(--palm)}

@media (max-width:880px){
  .hero{grid-template-columns:1fr;padding-top:36px;gap:8px}
  .branch{max-width:260px;order:-1;justify-self:start}
  .subject{grid-template-columns:1fr;gap:20px}
  .page-head .wrap{grid-template-columns:1fr}
  .tree-card{justify-self:start}
  .lesson-main{grid-template-columns:1fr}
  .aside{position:static}
  .unit-body{padding-inline-start:0}
  .stops{grid-template-columns:1fr;gap:24px}
  .stops::before{display:none}
  .nav .hide{display:none}
}
@media (max-width:520px){
  .wrap{padding:0 18px}
  .topbar .wrap{gap:16px}
  .me .nm{display:none}
  .unit-no{font-size:42px;min-width:42px}
  .unit-head{gap:14px}
  .lesson{flex-wrap:wrap}
  .lesson .lead{display:none}
  .toc .lead{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .branch .draw{stroke-dashoffset:0}.branch .fr{transform:none}
}
</style>
</head>
<body>
<div class="note-bar">نسخة معاينة للتصميم. تسجيل الدخول هنا تجريبي حتى نربطه بحساب Google.</div>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="منصة أثمر، الصفحة الرئيسية">
      <svg viewBox="0 0 32 32" aria-hidden="true" fill="none"><path d="M16 29c0-7 .4-13-1-19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M15.6 16c-5.5.3-9-2.6-9.6-8 5.6-.2 9 2.8 9.6 8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15.4 12.5c.2-5 3.4-8.4 9-8.6.1 5-3.2 8.4-9 8.6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="22" cy="20" r="4" fill="var(--date)"/></svg>
      أثمِر
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="top-actions" id="acct"></div>
  </div>
</header>
<main id="app"></main>
<footer><div class="wrap"><span><span class="hand">أثمِر</span>  كلُّ درسٍ بذرة، وكلُّ نجاحٍ ثمرة</span><span>منهج سلطنة عُمان، الفصل الدراسي الأول</span></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== المنهج (من فهرس كتاب الطالب) ===== */
const TEACHER = "أ. رتاج";
const SUBJECTS = {
  chem10:{key:"chem10",kind:"chem",name:"الكيمياء",grade:"الصف العاشر",
    units:[
      {n:1,title:"الفلزات وخصائصها",lessons:[["1-1","الترابط وخصائص الفلزات"],["1-2","العناصر الانتقالية"],["1-3","الفلزات القلوية"],["1-4","نشاط الفلزات"]]},
      {n:2,title:"استخلاص الفلزات واستخداماتها",lessons:[["2-1","استخلاص الفلزات"],["2-2","إنتاج الحديد والفولاذ"],["2-3","السبائك"],["2-4","تآكل الفلزات وحمايتها"]]},
      {n:3,title:"الكيمياء الكمية",lessons:[["3-1","الكتل النسبية"],["3-2","المول"],["3-3","حسابات تتضمن كتلًا متفاعلة"],["3-4","حسابات تتضمن حجوم الغازات"],["3-5","حسابات تتضمن محاليل متفاعلة"]]},

const store={get(){try{return JSON.parse(localStorage.getItem("athmer-demo-2")||"{}")}catch(e){return{}}},set(s){try{localStorage.setItem("athmer-demo-2",JSON.stringify(s))}catch(e){}}};

const lid=(sk,c)=>`${sk}-${c}`;
const st=id=>S.status[id]||"seed";
function prog(sk){const ids=SUBJECTS[sk].units.flatMap(u=>u.lessons.map(l=>lid(sk,l[0])));const d=ids.filter(i=>st(i)==="fruit").length;return{d,t:ids.length,p:Math.round(d/ids.length*100)}}
function stateTag(s){
  if(s==="fruit")return `<span class="state fruit">${IC.fruit}أثمر</span>`;
  if(s==="grow")return `<span class="state grow">${IC.sprout}قيد التعلّم</span>`;
  return `<span class="state">${IC.seed}لم يبدأ</span>`;
}

/* ===== الشجرة: فرع لكل وحدة، وعلامة لكل درس ===== */
function tree(sk,w=210){
  const s=SUBJECTS[sk];
  const br=[{x:100,y:150,dx:-74,dy:-58},{x:100,y:132,dx:72,dy:-52},{x:100,y:100,dx:-60,dy:-50},{x:100,y:84,dx:56,dy:-46}];
  let g=`<path d="M100 214c-2-40 3-90-2-150" class="tl" stroke-width="5"/>`;
  s.units.forEach((u,i)=>{
    const b=br[i],cx=b.x+b.dx*.45,cy=b.y+b.dy*.15,ex=b.x+b.dx,ey=b.y+b.dy;
    g+=`<path d="M${b.x} ${b.y}Q${cx} ${cy} ${ex} ${ey}" class="tl" stroke-width="3"/>`;
    u.lessons.forEach((l,j)=>{
      const t=(j+1)/(u.lessons.length+.4),m=1-t;
      const px=m*m*b.x+2*m*t*cx+t*t*ex, py=m*m*b.y+2*m*t*cy+t*t*ey;
      const side=j%2?1:-1, ox=px+side*2, oy=py+side*9;
      const s2=st(lid(sk,l[0]));
      if(s2==="fruit")g+=`<line x1="${px}" y1="${py}" x2="${ox}" y2="${oy}" stroke="var(--palm)" stroke-width="1.4"/><circle cx="${ox}" cy="${oy+(side>0?5:-5)}" r="6.5" fill="var(--date)"/>`;
      else if(s2==="grow")g+=`<ellipse cx="${ox}" cy="${oy}" rx="8" ry="4.2" transform="rotate(${b.dx<0?28:-28} ${ox} ${oy})" fill="var(--palm)"/>`;
      else g+=`<ellipse cx="${ox}" cy="${oy}" rx="7" ry="3.6" transform="rotate(${b.dx<0?28:-28} ${ox} ${oy})" fill="none" stroke="var(--soft)" stroke-width="1.1" stroke-dasharray="2 2"/>`;
    });
  });
  return `<svg viewBox="0 0 200 222" width="${w}" role="img" aria-label="شجرة التقدم في ${s.name}"><style>.tl{fill:none;stroke:var(--palm);stroke-linecap:round}</style><path d="M58 216c28-5 56-5 86 0" stroke="var(--rule)" stroke-width="3" fill="none" stroke-linecap="round"/>${g}</svg>`;
}

  if(t==="explain"){if(!d)return empty("الشرح قيد التحضير","سيظهر هنا عرض الدرس وشرح المعلمة.");
    return `<span class="example">مثال لشكل هذا التبويب</span><div class="slide"><div><h3>الترابط الفلزي</h3><p>هنا يظهر عرض الدرس من Google Drive، شريحة بعد شريحة.</p></div></div><div class="slide-bar"><button class="btn ghost sm">السابقة</button><span>شريحة 1 من 12</span><button class="btn ghost sm">التالية</button></div>`}
  if(t==="summary"){if(!d)return empty("الملخص قيد التحضير","ستظهر هنا بطاقات الملخص التفاعلي.");
    const c=[["الترابط الفلزي","قوة تجاذب بين <mark>أيونات الفلز الموجبة</mark> وبحر من <mark>الإلكترونات غير المتمركزة</mark>."],["لماذا توصل الفلزات الكهرباء؟","لأن إلكتروناتها غير المتمركزة <mark>حرّة الحركة</mark>، فتنقل الشحنة عبر الفلز."],["لماذا تُطرق الفلزات وتُسحب؟","لأن طبقات الأيونات الموجبة <mark>تنزلق</mark> فوق بعضها دون أن ينكسر الترابط الفلزي."]];
    return `<span class="example">مثال: اضغط البطاقة لتقلبها</span><div class="cards">${c.map(x=>`<button class="flip"><div class="in"><div class="f"><div>${x[0]}<small>اضغط لرؤية الإجابة</small></div></div><div class="b"><div>${x[1]}</div></div></div></button>`).join("")}</div>`}
  if(t==="activities"){if(!d)return empty("الأنشطة قيد التحضير","ستظهر هنا أنشطة الدرس من كتاب النشاط بشكل تفاعلي.");
    const it=[["موصل جيد للكهرباء","فلز"],["هش في الحالة الصلبة","لافلز"],["لامع عند قطعه حديثًا","فلز"],["رديء التوصيل للحرارة","لافلز"]];
    return `<span class="example">مثال: صنّف كل خاصية</span><div class="sort">${it.map(x=>`<div class="sort-row" data-a="${x[1]}"><span class="t">${x[0]}</span><button data-v="فلز">فلز</button><button data-v="لافلز">لافلز</button></div>`).join("")}</div>`}
  if(t==="exams"){if(!d)return empty("الأسئلة قيد التحضير","ستظهر هنا أسئلة الاختبارات السابقة لهذا الدرس، مع التصحيح والشرح.");
    const o=["وجود أيونات سالبة حرّة الحركة","وجود إلكترونات غير متمركزة حرّة الحركة","وجود جزيئات متعادلة بين الأيونات","قوة الروابط التساهمية بين الذرات"];
    return `<span class="example">سؤال توضيحي بنفس أسلوب الاختبارات</span><div class="q" data-r="1"><div class="stem">أيٌّ مما يأتي يفسّر قدرة الفلزات على توصيل التيار الكهربائي؟</div><div class="opts">${o.map((x,i)=>`<button class="opt" data-i="${i}"><span class="l">${"أبجد"[i]}</span>${x}</button>`).join("")}</div><div class="explain" id="ex"></div></div>`}
}
function vLesson(id){
  const f=find(id);if(!f)return vHome();
  const {sk,u,l}=f,s=SUBJECTS[sk];
  if(S.user&&st(id)==="seed"){S.status[id]="grow";save()}
  const done=st(id)==="fruit";
  return `<div class="${s.kind}">
    <header class="lesson-top"><div class="wrap">
      <nav class="crumbs"><a href="#home">الرئيسية</a><span>/</span><a href="#${sk}">${s.name}</a><span>/</span><span>الوحدة ${ORD[u.n]}: ${u.title}</span></nav>
      <div class="lesson-title"><span class="num" aria-hidden="true">${l[0]}</span><h1>${l[1]}</h1>
        <button class="btn ghost sm" id="bm" aria-pressed="${!!S.saved[id]}"><span style="color:var(--date);display:inline-flex">${IC.bm(!!S.saved[id])}</span>${S.saved[id]?"محفوظ":"حفظ للرجوع إليه"}</button></div>
      <div class="tabs" role="tablist">${TABS.map(t=>`<button class="tab ${t[0]===tab?"on":""}" role="tab" aria-selected="${t[0]===tab}" data-t="${t[0]}">${t[2]}${t[1]}</button>`).join("")}</div>
    </div></header>
    <div class="wrap lesson-main">
      <div>
        <div class="stage">${stage(id,tab)}</div>
        <div class="finish">${done?`<p>أثمر هذا الدرس في شجرتك.</p><a class="btn ghost sm" href="#${sk}">العودة إلى الوحدات</a>`:`<p>أنهيت الدرس وفهمته؟</p><button class="btn date" id="done">${IC.fruit}إنهاء الدرس وإضافة ثمرته</button>`}</div>
      </div>
      <aside class="aside">
        <div><h3>معايير النجاح</h3><ul class="criteria">
          ${id===DEMO?["أصف الترابط الفلزي.","أفسّر توصيل الفلزات للكهرباء والحرارة.","أفسّر قابلية الفلزات للطرق والسحب."].map((c,i)=>`<li><label><input type="checkbox" id="c${i}">${c}</label></li>`).join(""):`<li style="color:var(--soft)">تُضاف معايير هذا الدرس من ملف معايير النجاح.</li>`}
        </ul></div>
        ${id===DEMO?`<div class="teacher-note">ركّزوا على كلمة «غير متمركزة»، فهي مفتاح الدرس كله<small>ملاحظة ${TEACHER}</small></div>`:""}
        <figure style="margin:0;text-align:center;color:var(--soft);font-size:14px">${tree(sk,170)}<figcaption>شجرتك في ${s.name}</figcaption></figure>
      </aside>
    </div></div>`;
}
function vReview(sk,title){
  const s=SUBJECTS[sk];
  return `<header class="page-head ${s.kind}"><div class="wrap"><div><nav class="crumbs"><a href="#home">الرئيسية</a><span>/</span><a href="#${sk}">${s.name}</a></nav><h1 style="font-size:clamp(34px,5vw,56px)">${title}</h1></div></div></header>
    <div class="wrap">${empty("المراجعة قيد التحضير","ستضم ملخص الوحدة في صفحة واحدة، وخريطة ذهنية، واختبارًا شاملًا يُصحَّح فورًا ويبيّن الدروس التي تحتاج مراجعة.")}</div>`;
}
function vSaved(){
  const ids=Object.keys(S.saved).filter(k=>S.saved[k]);
  return `<div class="wrap saved"><h1>محفوظاتي</h1><p>الدروس التي حفظتها لترجع إليها.</p>
    ${ids.length?ids.map(id=>{const f=find(id);const s=SUBJECTS[f.sk];return `<a class="lesson ${s.kind}" href="#${id}"><span class="code">${f.l[0]}</span><span class="t">${f.l[1]}</span><span class="lead"></span><span class="state">${s.name}</span></a>`}).join("")
      :empty("لا توجد دروس محفوظة بعد","اضغط «حفظ للرجوع إليه» داخل أي درس ليظهر هنا.")}</div>`;
}

/* ===== التنقل ===== */
function render(){
  const r=(location.hash||"#home").slice(1)||"home";
  chrome(r);
  let h;
  if(r==="home")h=vHome();
  else if(SUBJECTS[r])h=vSubject(r);
  else if(r==="saved")h=vSaved();
  else if(/^(chem10|env11)-review-\d$/.test(r)){const[sk,,n]=r.split("-");h=vReview(sk,`مراجعة الوحدة ${ORD[n]}`)}
  else if(/^(chem10|env11)-big-\d$/.test(r)){const[sk,,n]=r.split("-");h=vReview(sk,SUBJECTS[sk].stops[n-1][0])}
  else h=vLesson(r);
  $("#app").innerHTML=h;bind(r);
}
function bind(r){
  document.querySelectorAll(".unit-head").forEach(b=>b.onclick=()=>{const u=b.closest(".unit");u.classList.toggle("open");S.open[r][u.dataset.u]=u.classList.contains("open");b.setAttribute("aria-expanded",S.open[r][u.dataset.u]);save()});
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tab=t.dataset.t;render()});
  document.querySelectorAll(".flip").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
  document.querySelectorAll(".sort-row").forEach(row=>row.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    row.classList.remove("ok","no");row.classList.add(b.dataset.v===row.dataset.a?"ok":"no");
    if(document.querySelectorAll(".sort-row.ok").length===document.querySelectorAll(".sort-row").length)toast("أحسنت، صنّفت الخصائص كلها بشكل صحيح");
  }));
  const q=$(".q");if(q)q.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    const R=+q.dataset.r,i=+o.dataset.i,all=q.querySelectorAll(".opt"),ex=$("#ex");
    all.forEach(x=>x.classList.remove("right","wrong"));all[R].classList.add("right");if(i!==R)o.classList.add("wrong");
    ex.innerHTML=i===R?"<b>إجابة صحيحة.</b> الإلكترونات غير المتمركزة تتحرك بحرية داخل الفلز فتنقل الشحنة الكهربائية.":"<b>الإجابة الصحيحة هي (ب).</b> لا توجد في الفلز أيونات سالبة حرة؛ الذي يتحرك هو الإلكترونات غير المتمركزة، ولهذا يوصل الفلز الكهرباء.";
    ex.classList.add("show");
  });
  const bm=$("#bm");if(bm)bm.onclick=()=>{if(needLogin())return;S.saved[r]=!S.saved[r];save();toast(S.saved[r]?"حُفظ الدرس في محفوظاتي":"أُزيل الدرس من محفوظاتي");render()};
  const d=$("#done");if(d)d.onclick=()=>{if(needLogin())return;S.status[r]="fruit";save();toast("أثمر تعبك! ثمرة جديدة في شجرتك");render()};
}
window.addEventListener("hashchange",()=>{tab="explain";render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
