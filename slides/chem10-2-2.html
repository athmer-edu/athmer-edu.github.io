<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>درس إنتاج الحديد والفولاذ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: a fixed 1920×1080 classroom "stage" scaled to the projector; top bar, phase strip, one idea per screen, team strip, control bar. Single light theme by choice (projector). */
:root{
  --paper:#f2f6f7;      /* page ground, cool pale */
  --card:#ffffff;
  --ink:#0c1a2e;        /* text */
  --navy:#14305c;       /* primary */
  --navy-2:#24467d;
  --teal:#0b7f80;       /* secondary */
  --teal-soft:#d9efee;
  --gold:#b98a1f;       /* accent */
  --gold-soft:#f6ebcc;
  --line:#c9d6de;
  --muted:#46586b;
  --ok:#1b6e44; --ok-soft:#dcf0e3;
  --warn:#9a4a12; --warn-soft:#fbe7d6;
  --ruqaa:"Baloo Bhaijaan 2","Traditional Arabic","Tahoma",serif;
  --display:"Lalezar","Baloo Bhaijaan 2","Tahoma",sans-serif;
  --num:"Readex Pro","Segoe UI","Tahoma",sans-serif;
  --fs:1;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);margin:0;overflow:hidden;font-family:var(--ruqaa)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;background:var(--paper)}
#stage{width:1920px;height:1080px;flex:none;position:relative;transform-origin:center center;background:var(--paper);
  display:flex;flex-direction:column;direction:rtl;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
button{font-family:var(--ruqaa);cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:5px solid var(--gold);outline-offset:3px}
.n{font-family:var(--num);font-weight:700;direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.5px}

/* top bar */
#top{height:96px;flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:0 28px}
#brand{font-size:44px;font-weight:700;white-space:nowrap}
#brand b{color:#f2cf73;font-weight:700}
#where{flex:1;min-width:0;font-size:32px;color:#d8e4f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{background:#ffffff1a;border:2px solid #ffffff55;color:#fff;border-radius:14px;font-size:28px;padding:8px 18px;min-height:64px;white-space:nowrap}
.tb:hover{background:#ffffff2e}
.tb[aria-pressed="true"]{background:#f2cf73;color:var(--navy);border-color:#f2cf73}

/* phase strip */
#phases{height:56px;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border-bottom:2px solid var(--line);font-size:28px}
.ph{padding:4px 20px;border-radius:999px;color:var(--muted);border:2px solid transparent}
.ph.on{background:var(--teal);color:#fff}
.ph.done{color:var(--teal);border-color:var(--teal-soft)}
.arrow{color:var(--line);font-size:26px}

#screen{flex:1;min-height:0;overflow:auto;padding:26px 48px;box-sizing:border-box;font-size:calc(40px*var(--fs));line-height:1.55}

/* team strip */
#teams{flex:none;display:flex;align-items:center;gap:12px;padding:10px 28px;background:var(--gold-soft);border-top:2px solid #e3cf98}
#teams[hidden]{display:none!important}
.team{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid #e3cf98;border-radius:16px;padding:6px 10px}
.team .tn{flex:1;min-width:0;font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .ts{font-family:var(--num);font-weight:700;font-size:38px;color:var(--navy);min-width:52px;text-align:center}
.team button{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-family:var(--num);font-size:30px;font-weight:700}
.team button.plus{background:var(--teal);color:#fff;border-color:var(--teal)}
#timer{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:16px;padding:6px 12px}
#timer[hidden]{display:none!important}
#timer .tv{font-family:var(--num);font-weight:700;font-size:40px;min-width:110px;text-align:center}
#timer.end .tv{color:#f2cf73}
#timer button{font-size:24px;border-radius:10px;border:2px solid #ffffff66;background:#ffffff1a;color:#fff;padding:4px 12px;min-height:50px}

/* bottom controls */
#bottom{height:116px;flex:none;display:flex;align-items:center;gap:16px;padding:0 28px;background:var(--card);border-top:3px solid var(--navy)}
.cb{font-size:calc(34px*var(--fs));min-height:84px;padding:6px 26px;border-radius:18px;border:3px solid var(--navy);background:var(--card);color:var(--navy);white-space:nowrap}
.cb.primary{background:var(--navy);color:#fff}
.cb.reveal{background:var(--teal);border-color:var(--teal);color:#fff}
.cb.hint{border-color:var(--gold);color:#7a5a0f;background:var(--gold-soft)}
.cb:disabled{opacity:.35;cursor:default}
#prog{flex:1;text-align:center;font-size:30px;color:var(--muted)}

/* overlays */
.ov{position:absolute;inset:0;background:#0c1a2ecc;display:flex;align-items:center;justify-content:center;z-index:20}
.ov[hidden]{display:none!important}
.panel{background:var(--card);border-radius:28px;padding:36px 44px;width:1300px;max-height:900px;overflow:auto;font-size:36px;box-sizing:border-box}
.panel h2{margin:0 0 18px;font-size:56px;color:var(--navy)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.menu-item{display:flex;align-items:center;gap:18px;text-align:right;font-size:36px;padding:16px 22px;border-radius:18px;border:3px solid var(--line);background:var(--paper);min-height:96px}
.menu-item .k{font-family:var(--num);font-weight:700;background:var(--navy);color:#fff;border-radius:12px;min-width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:30px}
.menu-item.cur{border-color:var(--gold);background:var(--gold-soft)}
.set-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 0;border-bottom:2px solid var(--line)}
.set-row label{min-width:300px}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{font-size:30px;padding:6px 22px;border-radius:14px;border:3px solid var(--line);background:var(--paper);min-height:64px}
.seg button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:#fff}
.names{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.names input{font-family:var(--ruqaa);font-size:28px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);min-width:0}

/* shared content pieces */
h1.t{font-size:calc(64px*var(--fs));line-height:1.25;color:var(--navy);margin:0 0 14px;text-wrap:balance}
h2.t{font-size:calc(52px*var(--fs));color:var(--navy);margin:0 0 10px}
.two{display:grid;grid-template-columns:740px 1fr;gap:44px;align-items:start}
.two>*{min-width:0}
.fig{margin:0;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;text-align:center}
.fig img,.fig svg{width:100%;height:auto;display:block;border-radius:12px}
.fig figcaption{font-size:calc(28px*var(--fs));color:var(--muted);margin-top:8px;line-height:1.4}
.ask{background:var(--navy);color:#fff;border-radius:22px;padding:18px 28px;font-size:calc(42px*var(--fs));margin-bottom:16px}
.ask small{display:block;font-size:calc(28px*var(--fs));color:#c6d6ee}
.step{background:var(--card);border-right:10px solid var(--teal);border-radius:16px;padding:12px 24px;margin-bottom:12px}
.memo{background:var(--gold-soft);border:3px dashed var(--gold);border-radius:20px;padding:14px 26px;margin-top:10px}
.memo .lab{font-size:calc(28px*var(--fs));color:#7a5a0f}
.memo .chain{font-size:calc(40px*var(--fs));color:var(--navy);font-weight:700}
.src{font-size:calc(26px*var(--fs));color:var(--muted)}
.note{font-size:calc(30px*var(--fs));color:var(--muted);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 18px;margin-top:10px}
.try{background:var(--teal-soft);border-radius:20px;padding:14px 24px;margin-top:10px}
.try .lab{font-size:calc(28px*var(--fs));color:var(--teal)}
.fb{border-radius:16px;padding:10px 20px;margin-top:10px;font-size:calc(34px*var(--fs))}
.fb.ok{background:var(--ok-soft);color:var(--ok);border:3px solid var(--ok)}
.fb.no{background:var(--warn-soft);color:var(--warn);border:3px solid var(--warn)}
.fb.hintbox{background:var(--gold-soft);color:#6b4f0d;border:3px solid var(--gold)}
.chip{display:inline-block;background:var(--teal-soft);color:var(--navy);border-radius:999px;padding:2px 20px;margin:4px;font-size:calc(32px*var(--fs))}

.opt{font-size:calc(36px*var(--fs));min-height:96px;padding:10px 26px;border-radius:20px;border:3px solid var(--navy-2);background:var(--card);text-align:center;line-height:1.35}
.opt:hover{background:#eef3fa}
.opt.sel{background:var(--teal-soft);border-color:var(--teal)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);opacity:.85}
.opt:disabled{cursor:default}
.opts{display:grid;gap:18px}
.opts.c2{grid-template-columns:1fr 1fr}
.opts.c3{grid-template-columns:1fr 1fr 1fr}
.opts.c4{grid-template-columns:repeat(4,1fr)}

/* element tiles & composition */
.els{display:flex;gap:14px;flex-wrap:wrap}
.el{width:150px;border:3px solid var(--navy);border-radius:14px;background:var(--card);text-align:center;padding:6px 4px;line-height:1.2}
.el .sw{height:30px;border-radius:8px;margin-bottom:4px;border:2px solid var(--navy)}
.el .nm{font-size:calc(30px*var(--fs))}
.el .pc{font-family:var(--num);font-weight:700;font-size:calc(38px*var(--fs));color:var(--navy);direction:ltr}
.el .sy{font-family:var(--num);font-size:22px;color:var(--muted)}
.bar{display:flex;direction:rtl;height:58px;border:3px solid var(--navy);border-radius:12px;overflow:hidden;margin:10px 0}
.bar>div{height:100%;border-left:2px solid var(--navy)}
.bar>div:last-child{border-left:none}
.flow{display:grid;grid-template-columns:1.35fr 60px .75fr 60px 1.25fr;align-items:stretch;gap:0}
.flow .box{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 18px;min-width:0}
.flow .box .lab{font-size:calc(26px*var(--fs));color:var(--teal)}
.flow .ar{display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--gold)}
.uses{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.use{width:200px;text-align:center;font-size:calc(26px*var(--fs));line-height:1.3}
.use svg,.use img{width:200px;height:150px;object-fit:cover;background:var(--paper);border:2px solid var(--line);border-radius:12px;display:block}

/* recipe uses inside the flow are smaller */
.flow .use{width:170px}
.flow .el{width:118px}
.flow .el .pc{font-size:calc(32px*var(--fs))}
.flow .els{gap:8px}
.flow .use svg,.flow .use img{width:170px;height:120px}
.ordpic{border-radius:12px;overflow:hidden;height:190px}
.ordpic img,.ordpic svg{width:100%;height:190px;object-fit:cover;display:block}
/* teacher's cut-out cards */
.tcard{border:4px solid #111;border-radius:22px;padding:10px 18px;font-weight:700;color:#111;text-align:center;font-size:calc(32px*var(--fs));line-height:1.35;box-shadow:0 3px 0 #111}
.tc-y{background:#f9e08f}.tc-g{background:#b4e29b}.tc-b{background:#a9dcf5}.tc-p{background:#cdb8f2}.tc-pk{background:#f7bfc4}.tc-gr{background:#c9c9c9}.tc-o{background:#fac9a8}.tc-w{background:#fff}
.tcard.sel{outline:6px solid var(--gold);outline-offset:3px}
.tb-grid{display:grid;gap:10px;align-items:stretch}
.tb-h{font-size:calc(30px*var(--fs));padding:6px 10px}
.tb-name{display:flex;align-items:center;justify-content:center}
.tb-img{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.tb-img img{width:100%;height:104px;object-fit:cover;display:block}
.tb-cell{border:4px dashed var(--navy-2);border-radius:22px;background:var(--card);font-family:var(--num);font-size:40px;color:var(--line);min-height:104px}
.tb-done{display:flex;align-items:center;justify-content:center;font-size:calc(28px*var(--fs))}
.tb-pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.tb-pool .tcard{font-size:calc(26px*var(--fs));padding:6px 16px;cursor:pointer}
.flip .flip-face{font-size:calc(56px*var(--fs));min-height:200px;display:flex;align-items:center;justify-content:center}
.flip.on .flip-face{font-size:calc(38px*var(--fs));min-height:0;margin-bottom:14px}
.flip-back{text-align:right;font-weight:600;font-size:calc(38px*var(--fs));animation:flipIn .35s ease-out}
@keyframes flipIn{from{transform:rotateX(70deg);opacity:0}to{transform:none;opacity:1}}
.imgmatch .card img{width:240px;height:120px;object-fit:cover;display:block;border-radius:10px}
.imgmatch .mcols{grid-template-columns:300px 1fr;gap:30px}
.imgmatch .col:first-child .card{padding:6px;display:flex;justify-content:center}
.imgmatch .col:last-child .card{font-size:calc(28px*var(--fs));text-align:right;min-height:132px}
h1.t,h2.t,#brand,.home h1,.panel h2,.flip .flip-face{font-family:var(--display);font-weight:400}
/* short version: Q&A, concept map, row picker, fill table */
.qa{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 18px;margin-bottom:8px}
.qa-q{display:flex;gap:14px;align-items:flex-start;font-size:calc(32px*var(--fs));cursor:pointer;line-height:1.4}
.qa-n{flex:none;background:var(--navy);color:#fff;border-radius:12px;padding:0 14px;font-size:calc(28px*var(--fs));margin-top:4px}
.qa-a{background:var(--teal-soft);color:var(--navy);border-radius:12px;padding:6px 16px;margin-top:6px;font-size:calc(30px*var(--fs));line-height:1.45}
.cmap2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:22px 40px;align-items:stretch}
.cm-root{grid-column:1/3;justify-self:center;font-family:var(--display);font-size:calc(72px*var(--fs));color:var(--navy);background:#e7eff5;border:4px solid var(--navy);border-radius:999px;padding:0 70px}
.cm-box{border:4px solid;border-radius:26px;padding:14px 26px;text-align:right;min-height:220px;display:flex;flex-direction:column;gap:8px}
.cm-t{font-family:var(--display);font-size:calc(46px*var(--fs))}
.cm-a{font-size:calc(34px*var(--fs));line-height:1.5;color:var(--ink)}
.rowpick{display:grid;grid-template-columns:80px 1fr 1fr 1.4fr;gap:10px}
.rp-h{background:var(--teal-soft);color:var(--navy);font-weight:700;text-align:center;border-radius:12px;padding:6px;font-size:calc(32px*var(--fs))}
.rp-h:first-child{background:none}
.rp-row{display:contents}
.rp-row>span{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px 14px;font-size:calc(32px*var(--fs));text-align:center;display:flex;align-items:center;justify-content:center}
.rp-row>.rp-box{border-color:var(--navy-2)}
.rp-row.right>span{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.rp-row.wrong>span{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);opacity:.8}
.rp-row.right>.rp-box::after{content:"✓";font-size:40px}
.ftab{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ftr{display:grid;grid-template-columns:180px 1.3fr 1fr 1.2fr;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-size:calc(23px*var(--fs));line-height:1.4;align-items:center}
.ftr b{color:var(--teal)}
.ftr>b:first-child{color:var(--navy)}
/* visual recipes */
.rcp{display:grid;justify-items:center;gap:2px}
.rcp-in{display:flex;align-items:flex-start;gap:14px}
.pls{font-family:var(--num);font-weight:700;font-size:56px;color:#3aa64a;align-self:center;margin-top:-50px}
.lump{display:flex;flex-direction:column;align-items:center;gap:2px;width:var(--ls)}
.lc{width:var(--ls);height:var(--ls);border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.lc img{width:100%;height:100%;object-fit:cover;transform:scale(1.14)}
.lsym{font-family:var(--num);font-weight:700;font-size:calc(var(--ls)*.4);color:#3a3f47}
.ln{font-size:calc(28px*var(--fs));color:var(--navy);line-height:1.15}
.lp{font-family:var(--num);font-weight:700;font-size:calc(40px*var(--fs));color:#c2185b;direction:ltr;line-height:1.1}
.parr{width:120px;height:80px;flex:none;align-self:center}
.parr.down{width:70px;height:56px}
.rcp-out{display:flex;align-items:center;gap:26px}
.bars,.useimg{margin:0;text-align:center;max-width:560px}
.bars img{height:150px;margin:0 auto;width:auto;display:block}
.useimg img,.useimg svg{height:200px;width:auto;max-width:520px;display:block;border-radius:14px;object-fit:contain}
.bars figcaption{font-family:var(--display);font-size:calc(40px*var(--fs));color:var(--navy)}
.useimg figcaption{font-size:calc(28px*var(--fs));color:var(--navy);max-width:520px}
.nobars{font-family:var(--display);font-size:calc(48px*var(--fs));color:var(--navy);background:#eef1f4;border-radius:24px;padding:24px 36px}
.rcp-prop{background:var(--gold-soft);border:2px solid #e3cf98;border-radius:999px;padding:4px 30px;font-size:calc(32px*var(--fs));color:#6b4f0d;margin-top:4px}
.crows{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:260px 250px 100px 380px 1fr;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:4px 14px}
.crow .ln{font-size:calc(22px*var(--fs))}
.cr-mix{display:flex;align-items:center;gap:6px}
.cr-mix .pls{margin-top:-24px}
.cr-pct{font-size:calc(30px*var(--fs));text-align:center;line-height:1.2}
.cr-pct .rng{font-family:var(--num);font-weight:700;color:#c2185b;font-size:calc(30px*var(--fs));direction:rtl;unicode-bidi:isolate;white-space:nowrap;display:block}
.cr-name{font-family:var(--display);font-size:calc(36px*var(--fs));color:var(--navy);line-height:1.2}
.cr-prop{font-family:var(--ruqaa);font-size:calc(24px*var(--fs));color:#6b4f0d;background:var(--gold-soft);border-radius:10px;padding:0 10px;margin-top:4px;display:inline-block}
.cr-use{margin:0;display:flex;align-items:center;gap:12px}
.cr-use img,.cr-use svg{width:130px;height:110px;object-fit:cover;border-radius:10px;flex:none}
.cr-use figcaption{font-size:calc(24px*var(--fs));line-height:1.35}
/* horizontal recipes + carbon meter */
.r3-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.r3{display:grid;grid-template-columns:auto 110px minmax(0,1fr) 110px minmax(0,1.15fr);align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:16px 22px}
.r3-row{display:flex;align-items:flex-start;gap:8px}
.r3-grid{display:grid;grid-template-columns:repeat(2,118px);gap:4px 18px}
.r3-al{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.r3-bars{height:170px;width:auto;max-width:100%;display:block}
.r3-name{font-family:var(--display);font-size:calc(42px*var(--fs));color:var(--navy);line-height:1.1}
.r3-use{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.r3-use img,.r3-use svg{height:250px;width:auto;max-width:100%;border-radius:16px;object-fit:contain;display:block}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}

/* order / match / sort */
.slots{display:flex;gap:10px;align-items:stretch;margin:12px 0}

.pool{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;min-height:100px}

/* ladder */

let AC=null;
function tone(kind){
  if(!st.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const notes = kind==='ok' ? [523,659] : kind==='end' ? [440,392] : [330];
    notes.forEach((f,k)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, AC.currentTime+k*0.14); g.gain.exponentialRampToValueAtTime(0.12, AC.currentTime+k*0.14+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+k*0.14+0.25); o.connect(g).connect(AC.destination); o.start(AC.currentTime+k*0.14); o.stop(AC.currentTime+k*0.14+0.3); });
  }catch(e){}
}

function cq(id,names=false){ const e=EQ[id];

function boSim(host){
  const $i = id => host.querySelector('#'+id);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PIV={x:300,y:250}, INNER=[[-58,-71],[-27,-116],[27,-116],[58,-71],[68,75],[60,104],[31,119],[-31,119],[-60,104],[-68,75]];
  let S, raf=null, alive=true;
  const say=(t,p,warn)=>{ const m=$i('boMsg'); m.classList.toggle('warn',!!warn); $i('boMsgT').textContent=t; $i('boMsgP').innerHTML=p; };
  function init(){
    S={step:0,busy:false,angle:0,fill:0,steel:0,slag:0,scrap:[],lime:false,lanceY:-10,hoodY:-40,flame:0,blowing:false,p:0,gas:[],bubbles:[],falling:[],
       crane:{x:-80,y:60,a:0,op:0,melt:1},chuteOp:0,hopperOp:0,stream:null,steelLadle:0,slagPot:0,alloy:null,fate:new Set(),done:false};
    $i('boFate').innerHTML='<div class="bo-empty">يظهر هنا مصير كل شائبة عند ضخّ الأكسجين.</div>';
    say('ابدئي التجربة','الحديد الخارج من الفرن العالي (الحديد الصب) يحتوي على حوالي <span class="n">4%</span> كربون فيكون هشًّا. اضغطي الخطوة الأولى: إمالة الفرن للتعبئة.');
    steps();
  }
  function steps(){
    $i('boSteps').innerHTML=BO_STEPS.map((s,i)=>`<button type="button" data-i="${i}" class="${i<S.step?'done':i===S.step?'cur':''}"><span class="k">${ar(i+1)}</span><span class="lb">${s.label}</span><span class="sg">(${s.st})</span></button>`).join('');
    const ok=S.step===9&&!S.busy&&!S.alloy; $$('[data-al]',host).forEach(b=>{ b.disabled=!ok; b.classList.toggle('on',S.alloy===b.dataset.al); });
  }
  const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2, lerp=(a,b,k)=>a+(b-a)*k, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const tween=(ms,fn)=>{ ms=RM?ms*.25:ms; return new Promise(r=>{ const t0=performance.now(); const f=t=>{ if(!alive) return r(); const k=Math.min(1,(t-t0)/ms); fn(ease(k),k); k<1?requestAnimationFrame(f):r(); }; requestAnimationFrame(f); }); };
  const sleep=ms=>new Promise(r=>setTimeout(r,RM?ms*.25:ms));
  const rot=(lx,ly,a)=>{ const r=a*Math.PI/180,c=Math.cos(r),s=Math.sin(r); return {x:PIV.x+lx*c-ly*s,y:PIV.y+lx*s+ly*c}; };
  const mouth=()=>rot(0,-130,S.angle);
  const bottomY=()=>Math.max(...INNER.map(([x,y])=>rot(x,y,S.angle).y));
  const levelY=()=>bottomY()-S.fill*235;
  const drop=o=>S.falling.push({...o,t:0});
  const ACT={
    async tilt(){ await tween(1400,k=>S.angle=lerp(0,-42,k)); },
    async iron(){ S.crane={x:-80,y:62,a:0,op:1,melt:1}; await tween(1300,k=>S.crane.x=lerp(-80,140,k)); await tween(700,k=>S.crane.a=lerp(0,62,k));
      S.stream='iron'; await tween(2600,k=>{ S.fill=lerp(0,.40,k); S.crane.melt=1-k; }); S.stream=null;
      await tween(600,k=>S.crane.a=lerp(62,0,k)); await tween(1000,k=>S.crane.x=lerp(140,-80,k)); S.crane.op=0; },
    async scrap(){ S.chuteOp=1; for(let n=0;n<9;n++){ drop({x:170+Math.random()*8,y:78,tx:mouth().x+(Math.random()-.5)*14,ty:mouth().y+8,c:'#8d99a6',w:13,h:6}); await sleep(170); }
      await sleep(900); for(let n=0;n<7;n++) S.scrap.push({x:-30+Math.random()*60,y:20+Math.random()*60,r:Math.random()*180,life:1});
      await tween(1600,k=>{ S.fill=lerp(.40,.47,k); S.scrap.forEach(s=>s.life=1-k); }); S.scrap=[]; S.chuteOp=0; },
    async up(){ await tween(1300,k=>S.angle=lerp(-42,0,k)); },
    async lime(){ S.hopperOp=1; for(let n=0;n<16;n++){ drop({x:362+Math.random()*6,y:112,tx:300+(Math.random()-.5)*40,ty:levelY(),c:'#f1efe8',w:5,h:5}); await sleep(90); } await sleep(1100); S.lime=true; S.hopperOp=0; },
    async hood(){ await tween(1300,k=>S.hoodY=lerp(-40,84,k)); },
    async lance(){ await tween(1500,k=>S.lanceY=lerp(-10,198,k)); },
    async blow(){ S.blowing=true; S.p=0; await tween(10000,(k,raw)=>{ S.p=raw; S.flame=1; }); S.blowing=false; S.flame=0; S.steel=1;
      say('اكتمل الضخّ','احترقت الشوائب: خرجت الغازات عبر الخزانة، وتكوّن الخبث فوق الفولاذ. اضغطي الخطوة التالية: رفع الخرطوم والخزانة.'); },
    async raise(){ await tween(1300,k=>S.lanceY=lerp(198,-10,k)); await tween(1100,k=>S.hoodY=lerp(84,-40,k)); },
    async tap(){ await tween(1600,k=>S.angle=lerp(0,96,k)); S.stream='steel'; await tween(3200,k=>{ S.fill=lerp(.47,0,k); S.steelLadle=k; }); S.stream=null; await tween(1200,k=>S.angle=lerp(96,0,k)); },
    async slag(){ await tween(1600,k=>S.angle=lerp(0,-104,k)); S.stream='slag'; const s0=S.slag; await tween(2200,k=>{ S.slag=lerp(s0,0,k); S.slagPot=k; }); S.stream=null; await tween(1300,k=>S.angle=lerp(-104,0,k)); finish(); },
  };
  async function doStep(i){
    if(S.busy) return;
    if(S.done){ say('انتهت الشحنة','اضغطي «إعادة التجربة» لتبدئي شحنة جديدة.'); return; }
    if(i<S.step){ say('تمّت هذه الخطوة',`«${BO_STEPS[i].label}» نُفّذت. الخطوة التالية: «${BO_STEPS[S.step].label}».`); return; }
    if(i>S.step){ tone('no'); say('ليس بعد!',BO_WHY[BO_STEPS[i].id]+` الخطوة التالية: «${BO_STEPS[S.step].label}».`,true); return; }
    S.busy=true; steps(); const id=BO_STEPS[i].id; say(...BO_INFO[id]); await ACT[id](); if(!alive) return; S.step++; S.busy=false; steps(); if(id!=='slag') tone('ok');
  }
  async function addAlloy(kind){
    if(S.busy||S.step!==9||S.alloy) return; S.busy=true; steps();
    const nm={Cr:'الكروم',Ni:'النيكل',W:'التنغستن'}[kind];
    say('إضافة '+nm,`تُضاف كميات محدّدة من ${nm} إلى الفولاذ وهو لا يزال منصهرًا، فيُصنع نوع مختلف من الفولاذ (تفاصيله في درس «السبائك»).`);
    for(let n=0;n<12;n++){ drop({x:300+(Math.random()-.5)*30,y:-10,tx:300+(Math.random()-.5)*40,ty:levelY(),c:n%2?'#b8c7b0':'#d9dde2',w:7,h:7}); await sleep(80); }
    await sleep(1200); S.alloy=kind; S.busy=false; steps();
  }
  function finish(){ S.done=true; S.step=BO_STEPS.length; steps(); tone('ok');
    say('أحسنتِ! أُنتج الفولاذ',`الكربون والكبريت خرجا غازاتٍ، والسيليكون والفوسفور صارا خبثًا مع الجير، وأُعيد تدوير الخردة${S.alloy?'، وأُضيف '+({Cr:'الكروم',Ni:'النيكل',W:'التنغستن'}[S.alloy])+' فصُنع نوع مختلف من الفولاذ':''}. الفرن جاهز للشحنة التالية.`); }
  function fate(){ if(!S.blowing) return; for(const [th,k,n,t] of BO_FATE){ if(S.p>=th&&!S.fate.has(k)){ S.fate.add(k); const f=$i('boFate'); const e=f.querySelector('.bo-empty'); if(e) e.remove(); f.insertAdjacentHTML('beforeend',`<div class="bo-f"><b>${n}</b><span>${t}</span></div>`); } } }
  function bars(){
    const p=S.step<7?0:S.p, has=S.fill>0||S.step>=9;
    const v={C:has?1-.95*ease(clamp((p-.08)/.9)):0, S:has?1-.6*clamp(p/.7):0, Si:has?1-clamp(p/.3):0, P:has?1-.9*clamp((p-.2)/.6):0};
    if(S.step>=9&&!S.blowing){ v.C=.05; v.S=.4; v.Si=0; v.P=.1; }
    if(S.step>=10&&S.fill<=0.001){ v.C=v.S=v.Si=v.P=0; }
    for(const k in v) $i('boB'+k).style.width=(100*v[k]).toFixed(0)+'%';
    $i('boBL').style.width=Math.round(100*S.slag/22)+'%';
    $i('boPhase').textContent=S.done?'اكتملت الشحنة':S.blowing?'جارٍ ضخّ الأكسجين…':S.step>=8&&S.fill>0?'فولاذ منصهر وفوقه خبث':S.fill>0?'حديد خام منصهر':'الفرن فارغ';
  }
  const NS='http://www.w3.org/2000/svg';
  const el=(tag,a)=>{ const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); return e; };
  let last=performance.now();
  function frame(t){
    if(!alive) return;
    const dt=Math.min(50,t-last)/1000; last=t;
    $i('boVessel').setAttribute('transform',`translate(${PIV.x} ${PIV.y}) rotate(${S.angle})`);
    const L=levelY(), show=S.fill>0.001;
    $i('boWorld').setAttribute('transform',`rotate(${-S.angle}) translate(${-PIV.x} ${-PIV.y})`);
    const lq=$i('boLiquid'); lq.setAttribute('y',L); lq.setAttribute('height',show?400:0); lq.setAttribute('fill',S.steel>.5?'url(#boSteel)':'url(#boIron)');
    $i('boShine').setAttribute('y',L); $i('boShine').setAttribute('opacity',show?.55:0);
    if(S.blowing&&S.lime) S.slag=6+16*clamp(S.p/.7); else if(S.lime&&S.step===5&&S.slag<3) S.slag=3;
    $i('boSlagRect').setAttribute('y',L-S.slag); $i('boSlagRect').setAttribute('height',Math.max(0,S.slag));
    const lf=$i('boLimeFloat');
    if((S.lime&&S.step<=7&&!S.blowing)||(S.blowing&&S.p<.45)){ if(!lf.childElementCount) for(let i=0;i<14;i++) lf.appendChild(el('rect',{width:5,height:4,fill:'#f1efe8',rx:1}));
      [...lf.children].forEach((r,i)=>{ r.setAttribute('x',250+i*7+Math.sin(t/600+i)*2); r.setAttribute('y',L-S.slag-3+Math.sin(t/400+i*1.7)); r.setAttribute('opacity',S.blowing?Math.max(0,1-S.p/.45):1); }); } else lf.innerHTML='';
    const sc=$i('boScrapIn'); sc.innerHTML=''; S.scrap.forEach(s=>sc.appendChild(el('rect',{x:s.x,y:s.y,width:14,height:6,fill:'#8d99a6',opacity:s.life,transform:`rotate(${s.r} ${s.x} ${s.y})`})));
    if(S.blowing&&Math.random()<.6) S.bubbles.push({x:300+(Math.random()-.5)*110,y:bottomY()-5,r:2+Math.random()*3});
    S.bubbles.forEach(b=>b.y-=60*dt*(1+Math.random())); S.bubbles=S.bubbles.filter(b=>b.y>L);
    const bb=$i('boBubbles'); bb.innerHTML=''; S.bubbles.forEach(b=>bb.appendChild(el('circle',{cx:b.x,cy:b.y,r:b.r,fill:'#fff3c4',opacity:.75})));
    $i('boHood').setAttribute('transform',`translate(0 ${S.hoodY})`); $i('boLance').setAttribute('transform',`translate(0 ${S.lanceY})`);
    const fl=$i('boFlameE'); fl.setAttribute('rx',S.flame?26+Math.random()*8:0); fl.setAttribute('ry',S.flame?14+Math.random()*6:0);
    $i('boGlow').setAttribute('opacity',S.blowing?.6+.3*Math.sin(t/120):0);
    $i('boLblHood').setAttribute('y',S.hoodY+22); $i('boLblLance').setAttribute('opacity',S.lanceY>40?1:0);
    if(S.blowing){ for(let i=0;i<30*dt;i++) S.gas.push({x:300+(Math.random()-.5)*50,y:mouth().y,vy:-(50+Math.random()*40),vx:(Math.random()-.5)*20,life:1,r:4+Math.random()*5,c:Math.random()<.15?'#e8d44d':'#9aa3ad'}); }
    S.gas.forEach(g=>{ g.y+=g.vy*dt; g.x+=(300-g.x)*dt*(g.y<S.hoodY+30?3:.4)+g.vx*dt; g.life-=dt*.45; g.r+=dt*3; }); S.gas=S.gas.filter(g=>g.life>0&&g.y>-20);
    const gg=$i('boGas'); gg.innerHTML=''; S.gas.forEach(g=>gg.appendChild(el('circle',{cx:g.x,cy:g.y,r:g.r,fill:g.c,opacity:g.life*.5})));
    const cr=$i('boCrane'); cr.setAttribute('opacity',S.crane.op); cr.setAttribute('transform',`translate(${S.crane.x} ${S.crane.y})`);
    $i('boLadle').setAttribute('transform',`rotate(${S.crane.a})`); $i('boLadleMelt').setAttribute('height',12*S.crane.melt+.01);
    const li=$i('boLblIron'); li.setAttribute('opacity',S.crane.op&&S.crane.x>40?1:0); li.setAttribute('x',S.crane.x-40); li.setAttribute('y',S.crane.y-44);
    $i('boChute').setAttribute('opacity',S.chuteOp); $i('boLblChute').setAttribute('opacity',S.chuteOp);
    $i('boHopper').setAttribute('opacity',S.hopperOp); $i('boLblLime').setAttribute('opacity',S.hopperOp);
    const fg=$i('boFalling'); fg.innerHTML='';
    S.falling.forEach(f=>{ f.t+=dt*1.3; const k=Math.min(1,f.t), x=lerp(f.x,f.tx,k), y=lerp(f.y,f.ty,k*k); fg.appendChild(el('rect',{x:x-f.w/2,y:y-f.h/2,width:f.w,height:f.h,fill:f.c,rx:1,transform:`rotate(${f.t*200} ${x} ${y})`})); });
    S.falling=S.falling.filter(f=>f.t<1);
    const st=$i('boStream');
    if(S.stream){ let a,b,col;
      if(S.stream==='iron'){ const r=S.crane.a*Math.PI/180; a={x:S.crane.x+36*Math.cos(r)+26*Math.sin(r),y:S.crane.y+36*Math.sin(r)-26*Math.cos(r)}; b=mouth(); col='url(#boIron)'; }
      else if(S.stream==='steel'){ a=rot(64,-62,S.angle); b={x:510,y:350}; col='url(#boSteel)'; }
      else { a=mouth(); b={x:84,y:356}; col='#8a6a46'; }
      st.setAttribute('d',`M${a.x} ${a.y} Q${a.x+(b.x-a.x)*.25} ${a.y+8} ${b.x} ${b.y}`); st.setAttribute('stroke',col); st.setAttribute('opacity',1); st.setAttribute('stroke-width',7+Math.sin(t/60));
    } else st.setAttribute('opacity',0);
    $i('boSteelIn').setAttribute('y',40-68*S.steelLadle); $i('boSlagIn').setAttribute('y',40-48*S.slagPot);
    fate(); bars();
    raf=requestAnimationFrame(frame);
  }
  host.addEventListener('click',e=>{
    const b=e.target.closest('[data-i]'); if(b) doStep(+b.dataset.i);
    const a=e.target.closest('[data-al]'); if(a) addAlloy(a.dataset.al);
    if(e.target.closest('#boReset')){ if(S.busy){ say('انتظري قليلًا','يمكنكِ إعادة التجربة بعد انتهاء الحركة الحالية.',true); return; } init(); }
    const l=e.target.closest('#boLabelsBtn'); if(l){ const g=$i('boLabels'); const on=g.style.display!=='none'; g.style.display=on?'none':''; l.textContent=on?'إظهار التسميات':'إخفاء التسميات'; }
  });
  init(); raf=requestAnimationFrame(frame);
  return {stop(){ alive=false; cancelAnimationFrame(raf); }, draw(){}};
}

  el.innerHTML = `<h1 class="t" style="font-size:calc(50px*var(--fs));margin-bottom:6px">كتاب الطالب صـ ٥٠ • سؤال ٢ (ج)</h1>
   <div class="step" style="margin:0 0 14px">ج. يحتوي الحديد المنصهر الذي يتجمّع عند قاعدة الفرن على ثنائي أكسيد السيليكون كنوع من الشوائب.</div>
   ${QA('اشرحي كيف تتم إزالته من الحديد المنصهر في الفرن العالي.',`يُضاف الحجر الجيري، فيتفكّك بالحرارة إلى أكسيد الكالسيوم (قاعدة)، الذي يتفاعل مع ثنائي أكسيد السيليكون (أكسيد حمضي) مكوّنًا سيليكات الكالسيوم (الخبث) المنصهرة، التي تطفو فوق الحديد لأنها أقل كثافة منه، وتُجمع منفصلة.<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${cq('e4')}${cq('e5')}</div>`,'ج')}
   ${awardRow()}`;
  bindAward(el);
}});

/* ---- 7 الخريطة الذهنية ---- */
const MMB=[
 {t:'المواد الداخلة',c:'#3a5670',x:732,y:20,a:['خام الحديد: الهيماتيت <b>Fe₂O₃</b>','فحم الكوك (كربون) + الحجر الجيري <b>CaCO₃</b>','هواء ساخن عبر ثقوب أسفل الفرن']},
 {t:'أجزاء الفرن العالي',c:'#0b7f80',x:31,y:20,a:['برج فولاذي ارتفاعه حوالي ٣٠ مترًا','طوب أكسيد الماغنيسيوم، مبرّد بالماء','صمامات الإغلاق • غاز العادم • هواء ساخن']},
 {t:'التفاعلات',c:'#9a4a12',x:732,y:285,a:['<span class="n">1900</span>°س: C + O₂ → CO₂','<span class="n">1000</span>°س: CO₂ + C → 2CO','<span class="n">600</span>°س: Fe₂O₃ + 3CO → 2Fe + 3CO₂']},
 {t:'إزالة الشوائب',c:'#7a5a0f',x:31,y:285,a:['الشائبة: الرمل (السيليكا SiO₂)','CaCO₃ ← حرارة ← CaO + CO₂','CaO + SiO₂ → CaSiO₃ (الخبث)']},
 {t:'النواتج والطاقة',c:'#4f4570',x:732,y:550,a:['الحديد في القاع (كثافته عالية)، والخبث فوقه','الغازات العادمة ← مبادل حراري ← هواء داخل','الحديد الصب: ٤٪ كربون ← هشّ']},
 {t:'صناعة الفولاذ',c:'#1b6e44',x:31,y:550,a:['(أ) حديد منصهر + خردة فولاذ','(ب) جير حي + أكسجين ← CO و CO₂','(ج) خبث يطفو ← سكب الفولاذ ثم الخبث']}];
function mindmap(ans){
  const ln=MMB.map(b=>{const bx=b.x<400?b.x+350:b.x, by=b.y+90; return `<path d="M561 397 L${bx} ${by}" stroke="${b.c}" stroke-width="5" fill="none" opacity=".55"/>`}).join('');
  return `<div class="mm"><svg class="ln" viewBox="0 0 1123 794" width="1123" height="794">${ln}</svg>
   <div class="mm-root">إنتاج الحديد<br>والفولاذ</div>
   ${MMB.map((b,i)=>`<div class="mm-b" data-m="${i}" style="left:${b.x}px;top:${b.y}px;border-color:${b.c}"><div class="mt" style="color:${b.c}">${b.t}</div><div class="ml">${b.a.map(x=>ans?`<div>• ${x}</div>`:'<span class="bl"></span>').join('')}</div></div>`).join('')}
   <div style="position:absolute;left:20px;bottom:10px;font-size:15px;color:#46586b">إعداد: أ. رتاج الراسبي</div></div>`;
}
add(7,'تصحيح الخريطة الذهنية',{ph0:'link', hint:'اضغطي على أي فرع لتكبيره.', render(el,S){
  const ans = S.ans!==false;
  el.innerHTML = `<div class="r3-head" style="margin-bottom:4px"><div><h1 class="t" style="margin:0;font-size:calc(46px*var(--fs))">تصحيح الخريطة الذهنية</h1><div class="src">صحّحي خريطتكِ بالقلم الأخضر • اضغطي على أي فرع لتكبيره</div></div>
     <div class="seg"><button data-a="0" aria-pressed="${!ans}">الخريطة فارغة</button><button data-a="1" aria-pressed="${ans}">إظهار الحلول</button></div></div>
   <div class="mmwrap"><div class="mmbox">${mindmap(ans)}</div></div>
   <div class="mmzoom" hidden><div class="mmz-in" style="position:relative"></div><button class="simbtn mmz-close">إغلاق ✕</button></div>`;
  const wrap=$('.mmwrap',el), box=$('.mmbox',el);
  requestAnimationFrame(()=>{ const sc=Math.min(wrap.clientWidth/1123, wrap.clientHeight/794); box.style.transform=`scale(${sc})`; box.style.width='1123px'; box.style.height='794px'; });
  el.onclick=(e)=>{
    const b=e.target.closest('[data-a]'); if(b){ S.ans=b.dataset.a==='1'; rerender(); return; }
    if(e.target.closest('.mmz-close')||(e.target.closest('.mmzoom')&&!e.target.closest('.mmz-in'))){ $('.mmzoom',el).hidden=true; return; }
    const g=e.target.closest('.mm-b');
    if(g){ const z=$('.mmzoom',el), zin=$('.mmz-in',el); const c=g.cloneNode(true); const w=g.offsetWidth, h=g.offsetHeight, k=Math.min(1500/w,620/h);
      c.style.position='absolute'; c.style.left='auto'; c.style.right='0'; c.style.top='0'; c.style.transform=`scale(${k})`; c.style.transformOrigin='top right'; c.style.cursor='default';
      zin.innerHTML=''; zin.style.width=(w*k)+'px'; zin.style.height=(h*k)+'px'; zin.appendChild(c); z.hidden=false; }
  };
}});

/* ===================== engine ===================== */
const PH = [['see','شاهدي صورة'],['guess','توقّعي'],['find','اكتشفي التفسير'],['try','جرّبي'],['link','اربطي واحفظي']];
let SCALE=1, S={}, revealed=0, hintOn=false;
const screenEl=$('#screen');
function setPhase(ph){ if(cur&&cur.as){ $('#phases').innerHTML=`<span class="as-ban ${cur.as[0]}">${cur.as[1]}</span>`; return; } const k=PH.findIndex(p=>p[0]===ph); $('#phases').innerHTML = PH.map((p,i)=>`${i?'<span class="arrow">←</span>':''}<span class="ph ${i===k?'on':i<k?'done':''}">${p[1]}</span>`).join(''); }
function curPhase(){ if(SCREENS[st.i].onReveal && S.revealed) return 'find'; const shown=$$('.rv:not([hidden])',screenEl); return shown.length ? shown[shown.length-1].dataset.ph : SCREENS[st.i].ph0; }
function updateControls(){
  const sc=SCREENS[st.i];
  $('#bPrev').disabled = st.i===0; $('#bNext').disabled = st.i===SCREENS.length-1;
  const more = $$('.rv[hidden]',screenEl).length>0 || (sc.onReveal && !S.revealed);
  $('#bReveal').disabled = !more; $('#bHint').disabled = !sc.hint;
  $('#prog').innerHTML = `<span class="n">${st.i+1} / ${SCREENS.length}</span>`;
  $('#where').textContent = `${STAGES[sc.stage]} (${ar(STIME[sc.stage])} د)  •  ${sc.title}`;
  setPhase(curPhase());
}
function rerender(keepReveal=true){
  if(cur&&cur.sim) cur.sim.stop();
  cur={}; const sc=SCREENS[st.i];
  screenEl.innerHTML=''; screenEl.onclick=null; screenEl.style.fontSize='';
  const host=document.createElement('div'); host.style.height='100%'; screenEl.appendChild(host);
  sc.render(host, S);
  const AS={5:['self','تمرين تكويني جماعي: كتاب النشاط'],6:['peer','تمرين ختامي فردي • تقويم أقران: بعد الإجابة تبادلي الكتاب مع زميلتكِ وصحّحي إجاباتها']}[sc.stage];
  cur.as = (AS && !/التعليمات|التقويم الذاتي|نجمتان|النتيجة/.test(sc.title)) ? AS : null;
  $$('.rv',host).forEach(x=>x.hidden=true);
  if(keepReveal) $$('.rv',host).slice(0,revealed).forEach(x=>x.hidden=false);
  if(hintOn && sc.hint) showHint(false);
  updateControls();
}
function go(i){ st.i=Math.max(0,Math.min(SCREENS.length-1,i)); S={}; revealed=0; hintOn=false; save(); rerender(false); screenEl.scrollTop=0; $('#ovMenu').hidden=true; }
function revealNext(){
  const nx=$('.rv[hidden]',screenEl), sc=SCREENS[st.i];
  if(nx){ nx.hidden=false; revealed++; nx.scrollIntoView({block:'nearest',behavior:'smooth'}); updateControls(); }
  else if(sc.onReveal && !S.revealed){ sc.onReveal(screenEl,S); }
}
screenEl.addEventListener('click',(e)=>{ const q=e.target.closest('.qa-q'); if(!q) return; const a=q.parentElement.querySelector('.qa-a[hidden]'); if(a){ a.hidden=false; revealed++; updateControls(); } });
function showHint(toggle=true){
  const sc=SCREENS[st.i]; if(!sc.hint) return;
  const old=$('#hintBox',screenEl);
  if(old){ if(toggle){ old.remove(); hintOn=false; } return; }
  hintOn=true; screenEl.firstElementChild.insertAdjacentHTML('afterbegin',`<div id="hintBox" class="fb hintbox" style="margin:0 0 12px">تلميح: ${sc.hint}</div>`);
}

/* teams, timer, mode */
function renderTeams(){
  const T=$('#teams'); T.hidden = st.mode!=='challenge';
  T.innerHTML = st.groups.map((g,k)=>`<div class="team"><span class="tn">${g.name}</span><button data-m="${k}" aria-label="إنقاص نقطة من ${g.name}">−</button><span class="ts">${g.score}</span><button class="plus" data-p="${k}" aria-label="إضافة نقطة إلى ${g.name}">+</button></div>`).join('') +
    `<div id="timer" ${st.timerOn?'':'hidden'}><span class="tv"></span><button id="tGo">ابدئي</button><button id="tRe">صفّري</button></div>`;
  drawTimer();
}
function addScore(k,d){ st.groups[k].score=Math.max(0,st.groups[k].score+d); save(); renderTeams(); }
$('#teams').addEventListener('click',(e)=>{
  const p=e.target.closest('[data-p]'), m=e.target.closest('[data-m]');
  if(p) addScore(+p.dataset.p,1); if(m) addScore(+m.dataset.m,-1);
  if(e.target.id==='tGo') timerToggle(); if(e.target.id==='tRe') timerReset();
});
let tLeft=null, tInt=null;
function drawTimer(){ const tv=$('#timer .tv'); if(!tv) return; if(tLeft==null) tLeft=st.timerDur;
  tv.textContent = `${Math.floor(tLeft/60)}:${String(tLeft%60).padStart(2,'0')}`; $('#timer').classList.toggle('end', tLeft===0);
  const g=$('#tGo'); if(g) g.textContent = tInt?'أوقفي':'ابدئي'; }
function timerToggle(){ if(tInt){ clearInterval(tInt); tInt=null; } else { if(tLeft===0) tLeft=st.timerDur; tInt=setInterval(()=>{ tLeft=Math.max(0,tLeft-1); if(tLeft===0){ clearInterval(tInt); tInt=null; tone('end'); } drawTimer(); },1000); } drawTimer(); }
function timerReset(){ clearInterval(tInt); tInt=null; tLeft=st.timerDur; drawTimer(); }
function setMode(m){ st.mode=m; save(); $('#bMode').textContent = m==='challenge'?'وضع التحدّي':'وضع الشرح'; $('#bMode').setAttribute('aria-pressed', m==='challenge'); renderTeams(); if(st.i) rerender(); }

/* settings panel */
let confirmReset=false;
function renderSettings(){
  const P=$('#setPanel'); const fontOk = document.fonts && document.fonts.check('40px "Baloo Bhaijaan 2"');
  P.innerHTML = `<h2>الإعدادات</h2>
   <div class="set-row"><label>الوضع</label><div class="seg"><button data-mode="explain" aria-pressed="${st.mode==='explain'}">وضع الشرح (بلا نقاط ولا مؤقت)</button><button data-mode="challenge" aria-pressed="${st.mode==='challenge'}">وضع التحدّي (مجموعات)</button></div></div>
   <div class="set-row"><label>عدد المجموعات</label><div class="seg"><button data-gn="-1">−</button><span class="n" style="font-size:40px;min-width:60px;text-align:center">${st.groups.length}</span><button data-gn="1">+</button></div></div>
   <div class="set-row"><label>أسماء المجموعات</label><div class="names">${st.groups.map((g,k)=>`<input id="gname${k}" data-gi="${k}" value="${g.name.replace(/"/g,'&quot;')}" aria-label="اسم المجموعة ${k+1}">`).join('')}</div></div>
   <div class="set-row"><label>المؤقت (اختياري)</label><div class="seg"><button data-timer="0" aria-pressed="${!st.timerOn}">مغلق</button><button data-timer="1" aria-pressed="${st.timerOn}">مفتوح</button></div>
     <div class="seg">${[30,60,90,120].map(s=>`<button data-dur="${s}" aria-pressed="${st.timerDur===s}"><span class="n">${s}</span> ث</button>`).join('')}</div></div>
   <div class="set-row"><label>الصوت</label><div class="seg"><button data-snd="0" aria-pressed="${!st.sound}">مغلق</button><button data-snd="1" aria-pressed="${st.sound}">نغمات هادئة</button></div></div>
   <div class="set-row"><label>الخط</label><span style="color:${fontOk?'var(--ok)':'var(--warn)'}">${fontOk?'✓ محمَّل ويعمل':'لم يُحمَّل بعد؛ يظهر خط بديل. تأكّدي من اتصال الجهاز بالإنترنت.'}</span></div>
   <div class="set-row"><label>إعادة البدء</label>${confirmReset?`<span>سيُمسح التقدم والنقاط. متأكدة؟</span><button class="cb" id="rsYes" style="border-color:var(--warn);color:var(--warn)">نعم، امسحي وابدئي</button><button class="cb" id="rsNo">تراجعي</button>`:`<button class="cb" id="rsAsk">إعادة البدء من الصفر</button><button class="cb" id="rsScore">تصفير النقاط فقط</button>`}</div>
   <div style="margin-top:20px;text-align:left"><button class="cb primary" data-close="ovSet">تم</button></div>`;
}
$('#setPanel').addEventListener('click',(e)=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.mode){ setMode(b.dataset.mode); }
  if(b.dataset.gn){ const n=st.groups.length+ +b.dataset.gn; if(n>=2&&n<=8){ if(n>st.groups.length) st.groups.push({name:DEFAULT_NAMES[n-1]||('مجموعة '+n),score:0}); else st.groups.pop(); save(); renderTeams(); if(st.i) rerender(); } }
  if(b.dataset.timer){ st.timerOn=b.dataset.timer==='1'; save(); renderTeams(); }
  if(b.dataset.dur){ st.timerDur=+b.dataset.dur; tLeft=st.timerDur; save(); renderTeams(); }
  if(b.dataset.snd){ st.sound=b.dataset.snd==='1'; save(); syncSound(); if(st.sound) tone('ok'); }
  if(b.id==='rsAsk') confirmReset=true;
  if(b.id==='rsNo') confirmReset=false;
  if(b.id==='rsScore'){ st.groups.forEach(g=>g.score=0); save(); renderTeams(); }
  if(b.id==='rsYes'){ try{localStorage.removeItem(KEY);}catch(e){} st={...st, i:0, groups:DEFAULT_NAMES.slice(0,6).map(n=>({name:n,score:0})), seen:[], mode:'explain', timerOn:false, timerDur:60}; confirmReset=false; save(); timerReset(); setMode('explain'); $('#ovSet').hidden=true; go(0); return; }
  if(b.dataset.close){ $('#'+b.dataset.close).hidden=true; return; }
  renderSettings();
});
$('#setPanel').addEventListener('input',(e)=>{ const i=e.target.dataset.gi; if(i!=null){ st.groups[+i].name=e.target.value||('مجموعة '+(+i+1)); save(); renderTeams(); } });

/* stage menu */
function renderMenu(){
  $('#menuGrid').innerHTML = STAGES.map((n,k)=>{ const first=SCREENS.findIndex(s=>s.stage===k); const cnt=SCREENS.filter(s=>s.stage===k).length;
    return `<button class="menu-item ${SCREENS[st.i].stage===k?'cur':''}" data-go="${first}"><span class="k">${ar(k)}</span><span style="flex:1">${n}</span><span class="tm">${ar(STIME[k])} د</span><span class="src">${ar(cnt)} ${cnt>2?'شاشات':'شاشة'}</span></button>`; }).join('');
}
$('#menuGrid').addEventListener('click',(e)=>{ const b=e.target.closest('[data-go]'); if(b) go(+b.dataset.go); });
document.addEventListener('click',(e)=>{ const c=e.target.closest('[data-close]'); if(c && !e.target.closest('#setPanel')) $('#'+c.dataset.close).hidden=true; });

/* top & bottom bars */
$('#bPrev').onclick=()=>go(st.i-1);
$('#bNext').onclick=()=>go(st.i+1);
$('#bReveal').onclick=revealNext;
$('#bHint').onclick=()=>showHint(true);
$('#bRetry').onclick=()=>{ const keep=SCREENS[st.i].stage===1&&S.sel!=null?{sel:S.sel,preds:S.preds}:{}; const keepO=S.o!=null?{o:S.o,done:(S.done||[]).filter(k=>k!==S.o)}:{}; S={...keep,...keepO}; rerender(); };
$('#bMenu').onclick=()=>{ renderMenu(); $('#ovMenu').hidden=false; };
$('#bSet').onclick=()=>{ confirmReset=false; renderSettings(); $('#ovSet').hidden=false; };
$('#bMode').onclick=()=>setMode(st.mode==='challenge'?'explain':'challenge');
function setFs(v){ st.fs=Math.round(Math.max(0.8,Math.min(1.3,v))*100)/100; document.documentElement.style.setProperty('--fs',st.fs); save(); }
$('#bFsUp').onclick=()=>{ setFs(st.fs+0.1); requestAnimationFrame(()=>{ if(SCREENS[st.i].title==='خريطة المفاهيم') rerender(); }); };
$('#bFsDown').onclick=()=>{ setFs(st.fs-0.1); requestAnimationFrame(()=>{ if(SCREENS[st.i].title==='خريطة المفاهيم') rerender(); }); };
function syncSound(){ $('#bSound').textContent = st.sound?'الصوت مفتوح':'الصوت مغلق'; $('#bSound').setAttribute('aria-pressed',st.sound); }
$('#bSound').onclick=()=>{ st.sound=!st.sound; save(); syncSound(); if(st.sound) tone('ok'); };
$('#bFull').onclick=()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
document.addEventListener('fullscreenchange',()=>{ $('#bFull').textContent = document.fullscreenElement?'الخروج من ملء الشاشة':'ملء الشاشة'; fit(); });
document.addEventListener('keydown',(e)=>{
  if(e.target.closest('input,select,textarea')) return;
  if(!$('#ovSet').hidden||!$('#ovMenu').hidden){ if(e.key==='Escape'){ $('#ovSet').hidden=true; $('#ovMenu').hidden=true; } return; }
  if(e.key==='ArrowLeft'||e.key==='PageDown'){ e.preventDefault(); go(st.i+1); }
  else if(e.key==='ArrowRight'||e.key==='PageUp'){ e.preventDefault(); go(st.i-1); }
  else if(e.key===' '||e.key==='Enter'){ if(!e.target.closest('button')){ e.preventDefault(); revealNext(); } }
});

/* scale the 1920×1080 stage to the screen */
function fit(){ const v=$('#viewport'); const cs=getComputedStyle(v); const w=v.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight), hh=v.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  SCALE=Math.min(w/1920, hh/1080); const s=$('#stage'); s.style.transform=`scale(${SCALE})`; s.style.margin=`${(1080*SCALE-1080)/2}px ${(1920*SCALE-1920)/2}px`; }
window.addEventListener('resize',()=>{ fit(); if(SCREENS[st.i].title==='خريطة المفاهيم') rerender(); });

/* boot */
setFs(st.fs); syncSound(); setMode(st.mode); fit();
if(st.i>=SCREENS.length) st.i=0;
go(st.i);
if(document.fonts) document.fonts.ready.then(()=>{ if(cur&&cur.sim) cur.sim.draw(); });

</script>
