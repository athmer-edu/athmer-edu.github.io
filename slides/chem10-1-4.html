<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نشاط الفلزات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* مسرح 1920×1080 يتكبّر على جهاز العرض. شريط علوي بأقسام الدرس، فكرة واحدة لكل شريحة، وكشف تدريجي بيد المعلمة. */
:root{
  --deep:#0b2a45; --sea:#1b5c86; --turq:#119da4; --turq-soft:#d6f1f2; --foam:#f3f9fb; --card:#ffffff;
  --ink:#0b1e30; --muted:#4d6274; --line:#c5d9e2;
  --sand:#e3ad3c; --sand-soft:#fbefd2; --ok:#1d8a5a; --ok-soft:#dcf2e6; --no:#c4513e; --no-soft:#fbe3dc;
  --cu:#b8652f; --cu-soft:#f7e3d6;
  --display:"Lalezar","Baloo Bhaijaan 2","Tahoma",sans-serif;
  --body:"Baloo Bhaijaan 2","Tahoma",sans-serif;
  --num:"Readex Pro","Segoe UI","Tahoma",sans-serif;
  --fs:1; color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--deep);color:var(--ink);font-family:var(--body);overflow:hidden}
#vp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--deep)}
#stage{width:1920px;height:1080px;flex:none;position:relative;background:var(--foam);display:flex;flex-direction:column;direction:rtl;overflow:hidden;transform-origin:center center;border-radius:6px}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:5px solid var(--sand);outline-offset:3px}
.n{font-family:var(--num);font-weight:700;direction:ltr;unicode-bidi:isolate;display:inline-block}
#top{height:92px;flex:none;display:flex;align-items:center;gap:14px;padding:0 26px;background:linear-gradient(90deg,var(--deep),var(--sea));color:#fff}
#brand{font-family:var(--display);font-size:42px;white-space:nowrap}
#brand b{color:#8fe3e6;font-weight:400}
#timer{font-family:var(--num);font-size:28px;background:#ffffff1a;border-radius:12px;padding:4px 14px;min-width:120px;text-align:center}
#secs{height:58px;flex:none;display:flex;gap:6px;justify-content:center;align-items:center;background:#fff;border-bottom:2px solid var(--line)}
.sec{border:2px solid transparent;background:none;color:var(--muted);border-radius:999px;padding:0 16px;font-size:24px;white-space:nowrap;min-height:46px}
.sec small{font-family:var(--num);font-size:18px;opacity:.8;margin-inline-start:6px}
.sec.on{background:var(--turq);color:#fff;font-weight:700}
.sec.done{color:var(--turq);border-color:var(--turq-soft)}
.tb{background:#ffffff1a;border:2px solid #ffffff55;color:#fff;border-radius:14px;font-size:26px;min-height:58px;padding:2px 16px;white-space:nowrap}
#prog{height:8px;flex:none;background:#d7e7ee}#prog>div{height:100%;background:var(--turq);transition:width .4s}
#screen{flex:1;min-height:0;position:relative;padding:16px 46px 10px;box-sizing:border-box;font-size:calc(40px*var(--fs));line-height:1.5;overflow:hidden}
#bottom{height:112px;flex:none;display:flex;align-items:center;gap:14px;padding:0 26px;background:var(--card);border-top:3px solid var(--deep)}
.cb{font-size:calc(32px*var(--fs));min-height:82px;padding:4px 26px;border-radius:18px;border:3px solid var(--deep);background:var(--card);color:var(--deep);white-space:nowrap}
.cb.go{background:var(--deep);color:#fff}.cb.rv{background:var(--turq);border-color:var(--turq);color:#fff}
.cb:disabled{opacity:.33;cursor:default}
#count{flex:1;text-align:center;font-size:30px;color:var(--muted)}
.head{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.chip{font-size:calc(26px*var(--fs));border-radius:999px;padding:0 18px;color:#fff;background:var(--sea);white-space:nowrap}
h1.t{font-family:var(--display);font-weight:400;color:var(--deep);font-size:calc(58px*var(--fs));line-height:1.15;margin:0;text-wrap:balance}
.grid2{display:grid;grid-template-columns:1fr 820px;gap:36px;align-items:start}
.grid2>*{min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pic{margin:0;background:var(--card);border:3px solid var(--line);border-radius:28px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
.pic svg{width:100%;height:auto;display:block;border-radius:18px}
.simh{width:100%}
.pic figcaption{font-size:calc(26px*var(--fs));color:var(--muted);text-align:center;line-height:1.3}
.line{font-size:calc(38px*var(--fs));line-height:1.4;background:var(--card);border-right:12px solid var(--turq);border-radius:18px;padding:8px 22px}
.line b{color:var(--sea)}
.line .h{background:#fff27a;border-radius:6px;padding:0 4px}
.ex{font-size:calc(32px*var(--fs));line-height:1.4;background:var(--turq-soft);border-radius:18px;padding:8px 22px}
.fix{font-size:calc(34px*var(--fs));line-height:1.35;background:var(--sand-soft);border:4px dashed var(--sand);border-radius:20px;padding:8px 22px;font-weight:700;color:#5c4206}
.lab{display:inline-block;font-family:var(--display);font-size:calc(30px*var(--fs));margin-left:10px;color:var(--sea)}
.fix .lab{color:#8a6410}
[data-s]{transition:opacity .45s,transform .45s}
[data-s].hid{opacity:0;transform:translateY(18px) scale(.98);pointer-events:none;visibility:hidden}
.chk{background:var(--card);border:3px solid var(--sea);border-radius:20px;padding:8px 18px}
.chk .q{font-size:calc(34px*var(--fs));font-weight:700;color:var(--deep);margin-bottom:6px}
.chk .q::before{content:"سؤال سريع: ";color:var(--turq)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{flex:1;min-width:220px;font-size:calc(29px*var(--fs));min-height:66px;border-radius:16px;border:3px solid var(--sea);background:var(--card);padding:2px 14px;line-height:1.25}
.opt:hover:not(:disabled){background:#eef7fb}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--no-soft);border-color:var(--no);color:var(--no);opacity:.85}
.fb{margin-top:8px;border-radius:14px;padding:6px 16px;font-size:calc(29px*var(--fs));line-height:1.4}
.fb.ok{background:var(--ok-soft);color:var(--ok);border:3px solid var(--ok)}
.fb.no{background:var(--no-soft);color:var(--no);border:3px solid var(--no)}
/* home */
.home{display:grid;grid-template-columns:1fr 820px;gap:46px;align-items:center;height:100%}
.home h1{font-family:var(--display);font-weight:400;font-size:calc(116px*var(--fs));line-height:1.1;color:var(--deep);margin:0}
.home h1 span{color:var(--turq)}
.home .sub{font-size:calc(34px*var(--fs));color:var(--muted)}
.big{font-size:calc(40px*var(--fs));min-height:96px;padding:6px 44px;border-radius:22px;border:none;background:var(--deep);color:#fff}
.letter{background:#fff;border:3px solid var(--line);border-radius:28px;padding:16px 36px}
.letter ol{margin:6px 0 0;padding:0 50px 0 0;font-size:calc(36px*var(--fs));display:grid;gap:2px}
.letter ol li::marker{font-family:var(--num);color:var(--turq);font-weight:700}
.plan{display:flex;gap:4px;margin-top:12px}
.pl{background:var(--turq-soft);border-radius:12px;padding:4px 6px;font-size:21px;line-height:1.25;text-align:center;color:var(--deep);min-width:0}
.pl b{display:block;font-family:var(--num);color:var(--sea)}
.outcome{display:inline-block;background:var(--deep);color:#fff;border-radius:14px;padding:2px 20px;font-size:calc(27px*var(--fs));margin-bottom:10px}
/* reveal cards */
.qa{display:grid;gap:14px}
.qa .card{background:#fff;border:3px solid var(--line);border-radius:22px;padding:10px 22px;cursor:pointer}
.qa .card .q{font-size:calc(36px*var(--fs));font-weight:700;color:var(--deep)}
.qa .card .q .no{font-family:var(--num);background:var(--sea);color:#fff;border-radius:50%;display:inline-flex;width:50px;height:50px;align-items:center;justify-content:center;font-size:26px;margin-left:12px}
.qa .card .a{font-size:calc(33px*var(--fs));color:var(--ok);margin-top:6px;border-top:2px dashed var(--line);padding-top:6px}
.qa .card .tapme{font-size:calc(22px*var(--fs));color:var(--muted)}
.qa .card.open{border-color:var(--turq);background:#f6fcfc}
.qa .card:not(.open) .a{display:none}
.qa .card.open .tapme{display:none}
/* groups (organise ideas) */
.cols5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.c5{background:#fff;border:4px solid var(--c);border-radius:24px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.c5 .no{font-family:var(--num);font-weight:700;width:58px;height:58px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}
.c5 svg{width:100%;height:170px}
.c5 .tt{font-family:var(--display);color:var(--c);font-size:calc(36px*var(--fs));line-height:1.15}
.c5 .why{font-size:calc(27px*var(--fs));line-height:1.35;background:#fbf8ef;border-radius:14px;padding:4px 10px;width:100%;box-sizing:border-box}
.c5 .why b{color:#c4304f}
/* terms */
.terms3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.term{background:#fff;border:4px solid var(--c);border-radius:26px;padding:12px 20px;cursor:pointer;min-height:330px;display:flex;flex-direction:column;gap:8px}
.term .tt{font-family:var(--display);color:var(--c);font-size:calc(46px*var(--fs));line-height:1.15}
.term .en{font-family:var(--num);font-size:24px;color:var(--muted);direction:ltr;text-align:right}
.term .df{font-size:calc(31px*var(--fs));line-height:1.45}
.term .df .h{background:#fff27a;border-radius:6px;padding:0 4px}
.term .tapme{font-size:calc(24px*var(--fs));color:var(--muted);margin-top:auto}
.term:not(.open) .df{filter:blur(12px);user-select:none}
.term.open .tapme{display:none}
/* table */
.cmp{width:100%;border-collapse:separate;border-spacing:8px 6px;font-size:calc(29px*var(--fs))}
.cmp th{font-family:var(--display);font-weight:400;font-size:calc(34px*var(--fs));background:var(--turq-soft);border-radius:16px;padding:4px 14px;color:var(--deep)}
.cmp thead th{background:none;font-size:calc(42px*var(--fs))}
.cmp td{background:var(--card);border:4px dashed var(--sea);border-radius:16px;text-align:center;cursor:pointer;height:60px;line-height:1.2;padding:2px 12px}
.cmp td .q{font-family:var(--num);color:var(--line);font-size:42px}
.cmp td.open{border-style:solid;border-color:var(--turq);background:#f2fbfb}
/* widget bar */
.wbar{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:8px}
.wbar button{font-size:calc(30px*var(--fs));min-height:72px;border-radius:16px;padding:2px 28px;border:3px solid var(--deep);background:var(--card)}
.wbar button.go{background:var(--deep);color:#fff}
.lat .ion circle{fill:#f7e3d6;stroke:var(--cu);stroke-width:3}
.lat .ion text{fill:var(--cu);font-family:var(--num);font-weight:700;font-size:30px;text-anchor:middle}
.lat .e{fill:var(--sand);stroke:#9c6f12;stroke-width:1.5}
.lat .row{transition:transform 1s cubic-bezier(.5,0,.2,1)}
.lat .sea{fill:#fdf6e6;stroke:var(--line);stroke-width:3}
.lab-t{font-family:"Baloo Bhaijaan 2",Tahoma;font-weight:700;font-size:30px;fill:var(--deep)}
/* activities */
.act-h{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}
.act-h .t2{font-family:var(--display);font-size:calc(52px*var(--fs));color:var(--deep);line-height:1.15}
.act-h .tp{font-size:calc(24px*var(--fs));background:var(--turq-soft);color:var(--sea);border-radius:999px;padding:0 16px;white-space:nowrap}
.ins{font-size:calc(30px*var(--fs));color:var(--muted);margin:-4px 0 10px}
.tok{font-size:calc(30px*var(--fs));background:var(--card);border:3px solid var(--sea);border-radius:16px;padding:6px 18px;min-height:66px;cursor:pointer;user-select:none;line-height:1.3;text-align:center}
.tok.sel{outline:5px solid var(--sand);background:var(--sand-soft)}
.bank{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:86px;padding:10px;border:3px dashed var(--line);border-radius:20px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.bin{min-height:330px;border:4px dashed var(--c);border-radius:22px;background:#fff;padding:8px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.bin .bt{font-family:var(--display);color:var(--c);font-size:calc(42px*var(--fs));text-align:center}
.bin .tok.good{border-color:var(--ok);background:var(--ok-soft)}
.bin .tok.bad{border-color:var(--no);background:var(--no-soft)}
.abtn{display:flex;gap:12px;justify-content:center;margin-top:10px}
.abtn button{font-size:calc(30px*var(--fs));min-height:70px;border-radius:16px;padding:2px 30px;border:3px solid var(--deep);background:var(--card)}
.abtn button.go{background:var(--deep);color:#fff}
.match{display:grid;grid-template-columns:1fr 1.7fr;gap:16px 140px;position:relative}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mi{font-size:calc(30px*var(--fs));background:var(--card);border:3px solid var(--sea);border-radius:16px;padding:6px 16px;min-height:84px;text-align:right;line-height:1.3;position:relative;z-index:1}
.mi.term2{font-weight:700;color:var(--deep);text-align:center}
.mi.sel{outline:5px solid var(--sand)}
.mi.good{border-color:var(--ok);background:var(--ok-soft)}
.mi.bad{animation:shake .35s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* remember */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.mc{background:#fff;border:4px solid var(--c);border-radius:26px;padding:14px 16px;text-align:center;cursor:pointer;min-height:300px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}
.mc .k{font-family:var(--display);color:var(--c);font-size:calc(66px*var(--fs));line-height:1}
.mc .ar{font-size:44px;color:var(--sand);line-height:1}
.mc .v{font-family:var(--display);font-size:calc(40px*var(--fs));color:var(--deep)}
.mc .x{font-size:calc(26px*var(--fs));color:var(--muted);line-height:1.35}
.mc:not(.open) .v,.mc:not(.open) .x{visibility:hidden}
.memo{text-align:center;font-family:var(--display);font-size:calc(50px*var(--fs));color:var(--sea);margin:18px 0 6px}
.memo .h{background:#fff27a;border-radius:10px;padding:0 10px}
.note{text-align:center;font-size:calc(24px*var(--fs));color:var(--muted)}
/* exercise title */
.exh{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.exh .k{font-family:var(--display);font-size:calc(96px*var(--fs));color:var(--deep);line-height:1.1}
.exh .p{display:flex;gap:16px}
.exh .p span{font-size:calc(38px*var(--fs));background:var(--turq-soft);color:var(--sea);border-radius:999px;padding:4px 30px}
.exh .s{font-size:calc(44px*var(--fs));color:var(--muted)}
.exh .s b{color:var(--deep)}
.bq{background:#fff;border:3px solid var(--line);border-radius:24px;padding:12px 26px;font-size:calc(40px*var(--fs));line-height:1.45}
.bq .src{font-size:calc(24px*var(--fs));color:var(--muted)}
.ans{margin-top:12px;background:var(--ok-soft);border:3px solid var(--ok);border-radius:20px;padding:8px 22px;font-size:calc(34px*var(--fs));line-height:1.45}
.ans b{color:var(--ok)}
.dt{width:100%;border-collapse:collapse;font-size:calc(28px*var(--fs));background:#fff;border-radius:18px;overflow:hidden}
.dt th{background:var(--sea);color:#fff;font-weight:700;padding:6px 10px}
.dt td{border-bottom:2px solid var(--line);padding:4px 10px;text-align:center}
.dt td:first-child{font-weight:700;color:var(--deep)}
/* mind map */
.mm{position:relative;height:calc(100% - 100px)}
.mm svg.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mm .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:320px;height:320px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--sea),var(--deep));color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:calc(50px*var(--fs));line-height:1.15;box-shadow:0 0 0 14px var(--turq-soft);z-index:1}
.mm .br{position:absolute;width:540px;transform:translate(-50%,-50%);background:#fff;border:4px solid var(--c);border-radius:24px;padding:6px 14px 10px;z-index:1}
.mm .bt{font-family:var(--display);font-size:calc(36px*var(--fs));color:var(--c);cursor:pointer}
.mm .its{display:flex;flex-wrap:wrap;gap:6px}
.mm .bi{font-size:calc(26px*var(--fs));border:3px dashed var(--c);border-radius:12px;padding:0 12px;background:#fff;min-width:120px;min-height:44px;cursor:pointer;line-height:1.35}
.mm .bi.blank{color:transparent;background:repeating-linear-gradient(90deg,#f1f5f8 0 14px,#fff 14px 20px)}
.mm .bi.shown{border-style:solid;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--ink)}
.tabs{display:flex;gap:12px}
.tabs button{font-size:calc(30px*var(--fs));padding:2px 26px;border-radius:999px;border:3px solid var(--sea);background:var(--card);min-height:62px}
.tabs button[aria-pressed="true"]{background:var(--sea);color:#fff}
.ov{position:absolute;inset:0;background:#0b2a45cc;display:flex;align-items:center;justify-content:center;z-index:50}
.panel{background:#fff;border-radius:28px;padding:30px 40px;width:1300px;max-height:900px;overflow:auto}
.panel h2{font-family:var(--display);font-weight:400;font-size:52px;color:var(--deep);margin:0 0 14px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid button{text-align:right;font-size:28px;border:3px solid var(--line);background:var(--foam);border-radius:16px;padding:8px 18px;min-height:66px}
.mgrid button.cur{border-color:var(--sand);background:var(--sand-soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="vp"><div id="stage" lang="ar" dir="rtl">
  <header id="top">
    <div id="brand">نشاط <b>الفلزات</b></div>
    <div style="flex:1"></div>
    <span id="timer" title="مؤقت الحصة">٠٠:٠٠</span>
    <button class="tb" id="bTimer">تشغيل المؤقت</button>
    <button class="tb" id="bMenu">الفهرس</button>
    <button class="tb" id="bDn" aria-label="تصغير الخط">أ−</button>
    <button class="tb" id="bUp" aria-label="تكبير الخط">أ+</button>
    <button class="tb" id="bFull">ملء الشاشة</button>
  </header>
  <nav id="secs" aria-label="أقسام الدرس"></nav><div id="prog"><div></div></div>
  <main id="screen"></main>
  <footer id="bottom">
    <button class="cb" id="bPrev">→ السابق</button>
    <button class="cb rv" id="bRev">إظهار التالي ▼</button>
    <button class="cb" id="bAll">إظهار الكل</button>
    <button class="cb" id="bReset">إعادة الشريحة</button>
    <div id="count"></div>
    <button class="cb go" id="bNext">التالي ←</button>
  </footer>
  <div class="ov" id="ov" hidden><div class="panel"><h2>فهرس الشرائح</h2><div class="mgrid" id="mgrid"></div><div style="text-align:left;margin-top:16px"><button class="cb" id="bClose">إغلاق</button></div></div></div>
</div></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const K='#0b2a45';
const T=(x,y,t,fs=30,c=K,ex='')=>`<text x="${x}" y="${y}" font-family="Baloo Bhaijaan 2, Tahoma" font-weight="700" font-size="${fs}" fill="${c}" text-anchor="middle" ${ex}>${t}</text>`;

  for(let y=0;y<rows;y++){s+=`<g class="row" data-row="${y}">`;for(let x=0;x<cols;x++){const cx=10+g/2+x*g,cy=10+g/2+y*g;s+=`<g class="ion"><circle cx="${cx}" cy="${cy}" r="${r}"/><text x="${cx}" y="${cy+11}">+</text></g>`}s+=`</g>`}

D.ptable=()=>{const cells=[];const add=(c,r,m)=>cells.push([c,r,m]);

  for(const r of [3,4,5,6]){for(let c=0;c<18;c++){let m='m';if(c>=13){m=(c-13)<(r-2)?'m':'nm'};if(c===17)m='nm';add(c,r,m)}}
  const w=44,h=44;return `<svg viewBox="0 0 ${18*w+20} ${7*h+80}" role="img" aria-label="الجدول الدوري: الفلزات تشغل معظمه من اليسار والوسط"><rect width="100%" height="100%" rx="20" fill="#fff"/>

/* ============ حركة الإلكترونات ============ */
function animate(svg){if(!svg||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const vb=svg.viewBox.baseVal,W=vb.width,Hh=vb.height;const dots=$$('.e',svg);const ions=$$('.ion circle',svg).map(c=>[+c.getAttribute('cx'),+c.getAttribute('cy'),+c.getAttribute('r')]);
  const P=dots.map(d=>({x:+d.getAttribute('cx'),y:+d.getAttribute('cy'),vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2}));cur.flow=false;
  const step=()=>{if(!svg.isConnected)return;P.forEach((p,i)=>{p.vx+=(Math.random()-.5)*.5;p.vy+=(Math.random()-.5)*.5;p.vx*=.94;p.vy*=.94;p.x+=p.vx+(cur.flow?-2.4:0);p.y+=p.vy;
    if(p.y<16||p.y>Hh-16){p.vy*=-1;p.y=Math.min(Hh-16,Math.max(16,p.y))}
    if(cur.flow){if(p.x<12)p.x=W-12}else if(p.x<16||p.x>W-16){p.vx*=-1;p.x=Math.min(W-16,Math.max(16,p.x))}
    for(const[cx,cy,r]of ions){const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy)||1,m=r+13;if(d<m){p.x=cx+dx/d*m;p.y=cy+dy/d*m;p.vx+=dx/d*.8;p.vy+=dy/d*.8}}
    dots[i].setAttribute('cx',p.x.toFixed(1));dots[i].setAttribute('cy',p.y.toFixed(1))});requestAnimationFrame(step)};requestAnimationFrame(step)}

/* ============ المحرّك ============ */
const screenEl=$('#screen');
function render(keep){const s=SL[idx];if(!keep)S={};screenEl.innerHTML='';screenEl.onclick=null;const el=document.createElement('div');el.style.height='100%';screenEl.appendChild(el);el.onclick=null;s.render(el);
  fixFormulas(el);cur.steps=$$('[data-s]',el).map(x=>+x.dataset.s);cur.max=cur.steps.length?Math.max(...cur.steps):0;if(!keep||S.step==null)S.step=0;applySteps();updateBar();try{localStorage.setItem('rt-14-idx',idx)}catch(e){}}
function fixFormulas(root){const re=/([A-Za-z()₀-₉]+[⁰-⁹]*[⁺⁻])/g;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/[⁺⁻]/.test(n.nodeValue)&&!n.parentElement.closest("svg,bdi,[dir=ltr],.n,option")?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});const L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(t=>{const f=document.createDocumentFragment();let last=0;t.nodeValue.replace(re,(m,_,i)=>{f.append(t.nodeValue.slice(last,i));const b=document.createElement("bdi");b.dir="ltr";b.textContent=m;f.append(b);last=i+m.length});f.append(t.nodeValue.slice(last));t.replaceWith(f)})}
function applySteps(){$$('[data-s]',screenEl).forEach(x=>x.classList.toggle('hid',+x.dataset.s>S.step))}
function updateBar(){const s=SL[idx];$('#count').textContent=`${ar(idx+1)} / ${ar(SL.length)} • ${s.title}`;$('#bPrev').disabled=idx===0;$('#bNext').disabled=idx===SL.length-1;$('#bRev').disabled=S.step>=cur.max;$('#bAll').disabled=S.step>=cur.max;
  $('#prog>div').style.width=((idx+1)/SL.length*100)+'%';
  $('#secs').innerHTML=SECS.map(([n,m],i)=>`<button class="sec ${i===s.sec?'on':i<s.sec?'done':''}" data-sec="${i}">${n}<small>${ar(m)} د</small></button>`).join('')}
function go(i){idx=Math.max(0,Math.min(SL.length-1,i));render()}
$('#bNext').onclick=()=>go(idx+1);$('#bPrev').onclick=()=>go(idx-1);
$('#bRev').onclick=()=>{if(S.step<cur.max){S.step=cur.steps.filter(v=>v>S.step).sort((a,b)=>a-b)[0];applySteps();updateBar()}};
$('#bAll').onclick=()=>{S.step=cur.max;applySteps();updateBar()};
$('#bReset').onclick=()=>render();
$('#secs').onclick=e=>{const b=e.target.closest('[data-sec]');if(b)go(SL.findIndex(s=>s.sec===+b.dataset.sec))};
let FS=1;const setFs=()=>document.documentElement.style.setProperty('--fs',FS);
$('#bUp').onclick=()=>{FS=Math.min(1.25,FS+.05);setFs()};$('#bDn').onclick=()=>{FS=Math.max(.8,FS-.05);setFs()};
$('#bFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('#bMenu').onclick=()=>{$('#mgrid').innerHTML=SL.map((s,i)=>`<button class="${i===idx?'cur':''}" data-i="${i}"><span class="n">${ar(i+1)}</span> ${s.title}</button>`).join('');$('#ov').hidden=false};
$('#mgrid').onclick=e=>{const b=e.target.closest('[data-i]');if(b){$('#ov').hidden=true;go(+b.dataset.i)}};$('#bClose').onclick=()=>$('#ov').hidden=true;
let tOn=false,t0=0,tAcc=0;setInterval(()=>{if(!tOn)return;const s=Math.floor((tAcc+Date.now()-t0)/1000);$('#timer').textContent=ar(String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'))},500);
$('#bTimer').onclick=()=>{if(tOn){tAcc+=Date.now()-t0;tOn=false;$('#bTimer').textContent='تشغيل المؤقت'}else{t0=Date.now();tOn=true;$('#bTimer').textContent='إيقاف المؤقت'}};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowLeft'||e.key==='PageDown')go(idx+1);else if(e.key==='ArrowRight'||e.key==='PageUp')go(idx-1);else if(e.key===' '){e.preventDefault();$('#bRev').click()}});
function fit(){const st=$('#stage'),k=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`scale(${k})`}
addEventListener('resize',fit);fit();
try{const v=+localStorage.getItem('rt-14-idx');if(v>0&&v<SL.length)idx=v}catch(e){}
render();
</script>
</body>
</html>
